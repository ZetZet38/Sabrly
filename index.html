<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sabrly</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sabrly">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app, glass cards over a deep black field, floating glass tab bar, full-screen detail pages. Dark only, by choice. */
:root{
  --bg:#000000;
  --bgtop:#303338;
  --bg2:#0B0D0E;
  --glow-a:rgba(64,200,160,.15);
  --glow-b:rgba(90,140,255,.09);
  --glass:rgba(26,29,32,.62);
  --glass-2:rgba(42,46,50,.72);
  --glass-hi:rgba(255,255,255,.07);
  --solid-a:#1A1D20;
  --solid-b:#131518;
  --line:rgba(255,255,255,.085);
  --fg:#EEF2F1;
  --muted:#8A9391;
  --faint:#4A5250;
  --cell:#16191B;
  --accent:#46E0AE;
  --accent-ink:#04140E;
  --amber:#F2A93B;
  --orange:#D9622B;
  --blue:#4C8DFF;
  --green:#2FCB8E;
  --crit:#FF5F6D;
  --num:"Barlow Condensed","SF Pro Display",-apple-system,system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --spring:cubic-bezier(.2,.9,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
body.authmode .tabbar{display:none}
.auth{max-width:420px;margin:0 auto;padding-top:6vh;display:flex;flex-direction:column;gap:16px}
.auth-ic{width:88px;height:88px;border-radius:22px;align-self:center;box-shadow:0 12px 40px rgba(70,224,174,.18)}
.auth h1{text-align:center}
.auth .lead{text-align:center;color:var(--muted);font-size:15px;margin:-6px 0 4px;text-wrap:balance}
.auth .link{align-self:center}
.auth-sep{height:1px;background:var(--line);margin:6px 0}
.auth .hint{text-align:center}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.4;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(118px + env(safe-area-inset-bottom,0px));overflow-x:hidden;
  min-height:calc(100vh + 1px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh + 1px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body.paged{padding-block:0 calc(40px + env(safe-area-inset-bottom,0px))}
body.paged .tabbar{display:none}
body.paged::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bgtop)}
/* soft grey-to-black fade behind everything */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--bgtop) 0%,#1F2124 25%,#0E0F11 50%,#000 74%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:30px;padding-top:14px}
.wrap.enter{animation:enter .28s var(--spring)}
@keyframes enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap.push{animation:push .3s var(--spring)}
@keyframes push{from{opacity:.3;transform:translateX(26px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px rgba(0,0,0,.35)}
.solid{background:linear-gradient(180deg,var(--solid-a),var(--solid-b));border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 26px rgba(0,0,0,.35)}
.card{border-radius:var(--r-lg);padding:16px}
.press{transition:transform .18s var(--spring)}
.press:active{transform:scale(.975)}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:23px;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sec>.sec-h h2,.sec>h2{font-size:29px;font-weight:750;letter-spacing:-.025em;line-height:1.1}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;background:var(--glass-2);font-size:13px;font-weight:600;color:var(--muted)}
.link{font-size:14px;font-weight:600;color:var(--fg);opacity:.85;display:inline-flex;align-items:center;gap:4px}
.hint{font-size:12.5px;color:var(--muted)}

/* Header + week strip */
.weekbar{border-radius:0 0 28px 28px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));margin-top:calc(-14px - env(safe-area-inset-top,0px));touch-action:pan-y}
.weekbar.glass{background:linear-gradient(180deg,#3A3E43 0%,#2F3337 100%);border:0;border-bottom:1px solid rgba(255,255,255,.1);box-shadow:inset 0 -1px 0 rgba(255,255,255,.03),0 12px 30px rgba(0,0,0,.45)}
.wb-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.mon{display:flex;flex-direction:column;align-items:flex-start;min-width:44px}
.mon b{font-size:14px;letter-spacing:.04em}
.mon span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-width:0;will-change:transform}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:14px;color:var(--muted);transition:background .2s}
.day .dn{font-size:12px}
.day .dd{font-family:var(--num);font-size:22px;font-weight:600;color:var(--fg);line-height:1}
.day .db{width:16px;height:3px;border-radius:2px;background:var(--faint);overflow:hidden}
.day .db i{display:block;height:100%;background:var(--accent)}
.day.fut .dd{color:var(--muted)}
.day.fut .db{background:transparent}
.day.today .dn{color:var(--fg);font-weight:700}
.day.today .dd::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--crit);margin:4px auto 0}
.day.sel{background:rgba(255,255,255,.13)}
.day.sel .dd{color:var(--fg)}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:19px;font-weight:700}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-8px}
.titlebar .tb-l{min-width:0;display:flex;flex-direction:column;gap:1px}
.titlebar .eyebrow{font-size:10.5px;letter-spacing:.11em;margin-bottom:0}
.titlebar .tb-row{display:flex;align-items:baseline;gap:7px;min-width:0;flex-wrap:wrap}
.titlebar h1{font-size:18px;letter-spacing:-.01em}
.titlebar .sub{font-size:13px;color:var(--muted)}
.titlebar .rbtn{width:32px;height:32px;font-size:17px}
.titlebar+.quote,.titlebar+.link+.quote{margin-top:-14px}
.wknav{display:flex;gap:8px;flex:none}
.rbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--glass-2);border:1px solid var(--line)}
.rbtn:disabled{opacity:.3}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;overflow-wrap:anywhere}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:400;background:var(--glass-2);border:1px solid var(--line);line-height:1}
.sec-h .right{display:flex;align-items:center;gap:12px}
/* Notes */
.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.nlist li{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);animation:enter .2s var(--spring)}
.nb{color:var(--accent);font-weight:700;flex:none;width:10px;line-height:1.45}
.nt{flex:1;min-width:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere;color:#DCE2E0}
.nx{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:13px;flex:none;background:rgba(255,255,255,.05)}
.nadd{display:flex;align-items:center;gap:10px;padding-top:6px}
.nadd .field{border-bottom-color:transparent}
.nplus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:19px;flex:none}
.emoinput{width:92px;flex:none;text-align:center;font-size:20px;min-height:42px;padding:6px 8px}
.emoprev{font-size:26px;line-height:1}
.futnote{border-radius:var(--r-md);padding:11px 14px;font-size:14px;color:var(--muted);border:1px dashed var(--line)}

.sec{display:flex;flex-direction:column;gap:12px}
.sec>.glass,.sec>.swipe{font-size:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

.banner{border-radius:var(--r-md);padding:12px 14px;border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);background:color-mix(in srgb,var(--amber) 10%,var(--glass))}
.banner b{color:var(--amber)}
.banner.crit{border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:color-mix(in srgb,var(--crit) 10%,var(--glass))}
.banner.crit b{color:var(--crit)}
.banner .bs{display:block;margin-top:4px;color:var(--fg);opacity:.92}
.banner.sit{font-size:13.5px;line-height:1.4;padding:10px 13px}
.banner.sit .bs{margin-top:3px}
.banner.neutral{border-color:var(--line);background:var(--glass)}
.banner.neutral b{color:var(--fg)}
.banner.good{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 11%,var(--glass))}
.banner.good b{color:var(--accent)}
/* Tagesspruch */
.quote{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;width:100%;overflow:hidden;border-radius:var(--r-lg);padding:18px 20px 19px;--qc:var(--accent);
  background:radial-gradient(130% 120% at 0% 0%,color-mix(in srgb,var(--qc) 17%,transparent),transparent 62%),linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid color-mix(in srgb,var(--qc) 30%,var(--line));box-shadow:inset 0 1px 0 var(--glass-hi),0 14px 34px rgba(0,0,0,.4);animation:enter .25s var(--spring);transition:transform .15s}
.quote:active{transform:scale(.985)}
.quote.vers{--qc:#E3BE76}
.qh-top{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
.qh-lab{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--qc)}
.qh-more{font-size:16px;color:var(--muted);line-height:1}
.quote .qt{position:relative;font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;font-size:24px;line-height:1.36;color:#F4F7F6;font-weight:500;overflow-wrap:anywhere;text-wrap:pretty}
.quote .qt.m{font-size:20px}
.quote .qt.l{font-size:17.5px;line-height:1.45}
.quote .qs{position:relative;font-size:14px;font-weight:600;color:var(--qc)}
.qh-mark{position:absolute;right:14px;bottom:-84px;font-family:Georgia,"Times New Roman",serif;font-size:150px;line-height:1;color:var(--qc);opacity:.1;pointer-events:none}
/* Sätze & Verse list */
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qlist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.qlist .qtag{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);margin-top:2px}
.qlist .qtag.v{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.qlist .qbody{flex:1;min-width:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.qlist .qbody small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13.5px;color:#C9D0CE}
.sug span{flex:1;min-width:0;overflow-wrap:anywhere}
.sug b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);color:var(--accent);font-size:17px;font-weight:500}
.switch{position:relative;width:52px;height:31px;border-radius:999px;background:rgba(255,255,255,.14);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s var(--spring)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(21px)}
.sitgrid{display:flex;flex-direction:column;gap:12px}
.sitgrid.off{opacity:.45}

/* Mood */
.mood{display:flex;justify-content:space-between;gap:6px;margin-top:2px}
.mood button{flex:1;max-width:46px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:21px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:transform .2s var(--spring),opacity .2s,background .2s}
.mood.set button{opacity:.42}
.mood button.on{opacity:1;background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent);transform:scale(1.08);animation:pop .3s var(--spring)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.14)}100%{transform:scale(1.08)}}

/* Habit rows */
.hrow{border-radius:var(--r-lg);padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:12px}
.hrow .top{display:flex;align-items:center;gap:12px}
.emo{font-size:18px;width:26px;text-align:center;flex:none}
.hname{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.hname small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:1px}
.hrow.done .hname{color:var(--muted)}
.hrow.locked{opacity:.62}
/* Heute: Namen von Habits und Aufgaben deutlicher */
.hl .hname{font-size:17px;font-weight:700;letter-spacing:-.01em;color:#F4F7F6}
.hl .hname small{font-size:12px;font-weight:500;letter-spacing:0;margin-top:2px}
.hl .emo{font-size:20px;width:28px}
.hl .hrow.done .hname{color:var(--muted)}
.hl .todo .tt b{font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:#F4F7F6}
.hl .todo .tt span{font-size:12px}
.hl .todo.done .tt b{color:var(--muted)}
.circle{width:34px;height:34px;border-radius:50%;border:2px solid #5D6563;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .2s var(--spring)}
.circle.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop2 .32s var(--spring)}
.circle:disabled,.chip:disabled,.cbtn:disabled,.check:disabled{opacity:.45}
@keyframes pop2{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.circle svg{width:20px;height:20px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.chip{border-radius:11px;padding:8px 4px;font-size:12.5px;font-weight:600;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);transition:background .2s,border-color .2s,transform .15s}
.chip:not(:disabled):active{transform:scale(.94)}
.chip.on{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:color-mix(in srgb,var(--accent) 70%,transparent);color:var(--fg)}
.hsw-host{position:relative}
.hsw{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;z-index:6;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.chip{position:relative;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chip .pb{position:absolute;left:0;bottom:0;height:3px;background:#E3BE76;border-radius:0 3px 3px 0}
.chip .pe{position:absolute;top:1px;right:4px;font-size:9px;font-style:normal;color:#E3BE76}
.chip.plock{opacity:.38}
.chip.pmiss{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));color:color-mix(in srgb,var(--crit) 70%,var(--muted))}
.pstat{font-size:12.5px;font-weight:600;color:#E3BE76;margin-top:-2px}
.link.pyest{align-self:flex-start;font-size:13px;margin-top:-4px}
.ring.hasg b{font-size:13px}
.ptimes{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px}
.ptimes span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;background:rgba(255,255,255,.04)}
.ptimes small{font-size:10.5px;color:var(--muted);font-weight:600}
.ptimes b{font-size:14px}
.pval{font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.plist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.pcity{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:left}
.pcity b{font-size:15px}.pcity span{font-size:12px;color:var(--muted)}
.pprev{font-size:15px}.pprev b{color:#E3BE76;font-size:20px;margin-left:6px}
.pbars{display:flex;gap:8px;align-items:flex-end}
.pbcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.pbt{width:100%;max-width:26px;height:64px;border-radius:7px;background:rgba(227,190,118,.12);display:flex;align-items:flex-end;overflow:hidden}
.pbt i{display:block;width:100%;background:#E3BE76;border-radius:7px}
.pbcol small{font-size:11px;color:var(--muted)}
.fold{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.fold .chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin-left:2px;transition:transform .2s;flex:none}
.fold[aria-expanded="true"] .chev{transform:rotate(45deg)}
.counter{display:flex;align-items:center;gap:8px}
.cbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;transition:transform .15s}
.cbtn:not(:disabled):active{transform:scale(.9)}
.cbtn.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--faint);transition:background .2s}
.dots i.on{background:var(--accent)}

/* Task / journal */
.taskline{display:flex;align-items:center;gap:12px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #5D6563;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop2 .3s var(--spring)}
.check svg{width:16px;height:16px}
.field{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 0;font-size:16px;color:#DCE2E0;outline:none;border-radius:0}
.field:focus{border-bottom-color:var(--accent)}
.field::placeholder{color:var(--faint);font-size:15px}
.taskline.done .field{color:var(--muted);text-decoration:line-through}
.saved{font-size:12px;color:var(--accent);opacity:0;transition:opacity .3s;min-height:16px}
.saved.show{opacity:1}

/* Tagesablauf */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.tl-item:first-child{border-top:0}
.tl-item .t{font-family:var(--num);font-size:15px;font-weight:600;min-width:52px;color:var(--accent);font-variant-numeric:tabular-nums}
.tl-item .t.none{color:var(--faint)}
.tl-item .ic{width:22px;text-align:center;flex:none;font-size:17px}
.tl-item .x2{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.tl-item .x2 small{display:block;font-size:12px;color:var(--muted)}
.tl-item.done .x2{color:var(--muted);text-decoration:line-through}

/* Swipe rows */
.swipe{position:relative;touch-action:pan-y}
.swipe-actions{position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;gap:8px;padding-left:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.swipe.open .swipe-actions{pointer-events:auto;opacity:1}
.swipe-front{position:relative;z-index:1;transition:transform .34s var(--spring);touch-action:pan-y;will-change:transform}
.swipe.open .swipe-front{transform:translateX(calc(-1*var(--sw,0px)))}
.sa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;width:62px}
.sa i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;transition:transform .15s}
.sa:active i{transform:scale(.9)}
.sa i svg{width:22px;height:22px}
.sa-del i{background:var(--crit)}
.sa-arch i{background:var(--orange)}
.sa-edit i{background:#6B7270}
.sa-ok i{background:var(--green)}

/* Todos */
.todo{border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:12px}
.todo .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.todo .tt b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.todo .tt span{font-size:11.5px;color:var(--muted)}
.todo .tt span.over{color:var(--crit)}
.todo.done .tt b{color:var(--muted);text-decoration:line-through}
.pdot{width:9px;height:9px;border-radius:50%;flex:none}
.p-h{background:var(--amber)}.p-n{background:var(--blue)}.p-l{background:var(--green)}
.addrow{border-radius:var(--r-lg);padding:13px 16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:14.5px;font-weight:600}
.addrow .plusic{margin-left:auto;font-size:26px;font-weight:300;color:var(--muted)}
.overview{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.overview>div{display:flex;flex-direction:column;gap:2px;padding:4px 0}
.overview>div+div{border-left:1px solid var(--line)}
.overview b{font-family:var(--num);font-size:34px;font-weight:600;line-height:1.05}
.overview span{font-size:12.5px;color:var(--muted)}

/* Priority cards: glow rises from the bottom, like light under frosted glass */
.prios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prio{--pc:var(--blue);position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:linear-gradient(180deg,#1B1E22,#101215);border:1px solid color-mix(in srgb,var(--pc) 22%,var(--line));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 28px rgba(0,0,0,.4);transition:transform .2s var(--spring),box-shadow .25s,border-color .25s}
.prio::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 75% at 50% 112%,color-mix(in srgb,var(--pc) 85%,transparent) 0%,color-mix(in srgb,var(--pc) 38%,transparent) 34%,color-mix(in srgb,var(--pc) 8%,transparent) 62%,transparent 80%)}
.prio::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 38%),radial-gradient(60% 30% at 50% 0%,rgba(255,255,255,.06),transparent 70%)}
.prio>*{position:relative;z-index:1}
.prio b{font-family:var(--num);font-size:44px;font-weight:600;line-height:.95;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.prio span{font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prio:active{transform:scale(.96)}
.prio.on{border-color:var(--pc);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px var(--pc),0 10px 34px color-mix(in srgb,var(--pc) 35%,transparent)}
.prio.h{--pc:var(--amber)}.prio.n{--pc:var(--blue)}.prio.l{--pc:var(--green)}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{font-size:18px}

/* Habit cards */
.hcard{border-radius:var(--r-lg);padding:12px 14px 13px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.hcard .hname{font-size:18px;font-weight:700;letter-spacing:-.01em}
.hcard .hname small{font-size:11.5px;font-weight:500;letter-spacing:0}
.hcard .bignum{font-family:var(--num);font-size:23px;font-weight:600;line-height:1}
.hcard .bignum small{font-size:16px;color:var(--muted)}
.hcard .hsub{font-size:11.5px;color:var(--muted)}
.hcard .flame{font-size:15px}
.hcard .bar{height:4px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.flame{font-family:var(--num);font-size:18px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:300}

/* Stats */
.bigpct{font-family:var(--num);font-size:46px;font-weight:600;line-height:1}
.bigpct small{font-size:22px;color:var(--muted);margin-left:2px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bcol .bv{font-family:var(--num);font-size:14px;font-weight:600;color:var(--muted);height:16px;font-variant-numeric:tabular-nums}
.bcol .btrack{width:100%;max-width:34px;height:132px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:flex-end;overflow:hidden;position:relative}
.bcol .btrack::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(255,255,255,.08)}
.bcol .btrack i{display:block;width:100%;border-radius:10px;background:linear-gradient(180deg,#86F3CF,#2FB98C);transition:height .4s var(--spring)}
.bcol .bl{font-size:12px;font-weight:600;color:var(--muted)}
.bcol.today .bl{color:var(--fg)}
.bcol.today .btrack{box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.bcol.fut .btrack{background:transparent;border:1px dashed var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:12px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:4px}
.mcell{aspect-ratio:1;max-width:100%;border-radius:50%;padding:3px;display:grid;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),rgba(255,255,255,.08) 0);transition:transform .15s}
button.mcell:active{transform:scale(.88)}
.mcell>span{border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-family:var(--num);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.mcell.full>span{background:var(--accent);color:var(--accent-ink)}
.mcell.fut{background:transparent}
.mcell.fut>span{background:transparent;color:var(--muted)}
.mcell.off{background:transparent}
.mcell.off>span{background:transparent;color:var(--faint)}
.mcell.today{box-shadow:0 0 0 2px var(--fg)}
.mcell.blank{background:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--num);font-size:30px;font-weight:600;line-height:1.05}
.kpi span{font-size:12px;color:var(--muted)}
.hstat{border-radius:var(--r-md);padding:13px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.hstat .hs-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hstat .hs-main b{font-weight:600;overflow-wrap:anywhere}
.hstat .hs-num{font-family:var(--num);font-size:22px;font-weight:600;text-align:right;min-width:54px}
.hstat .hs-num small{display:block;font-family:var(--ui);font-size:11.5px;color:var(--muted);font-weight:500}

/* Detail / form pages */
.ptopbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:grid;grid-template-columns:minmax(84px,auto) 1fr minmax(84px,auto);align-items:center;gap:8px;
  padding:10px 0;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.ptopbar h2{font-size:18px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptopbar .r{justify-self:end}
.hbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.txtbtn{padding:10px 14px;border-radius:999px;font-weight:700;font-size:15px}
.txtbtn.pri{background:var(--accent);color:var(--accent-ink)}
.txtbtn.sec2{background:var(--glass-2);border:1px solid var(--line);color:var(--fg)}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{border-radius:var(--r-lg);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600}
.bigbtn .e{font-size:28px}
.bigbtn.danger{color:var(--crit)}
.fgroup{display:flex;flex-direction:column;gap:8px}
.tinput{width:100%;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;outline:none;min-height:48px}
.tinput:focus{border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--glass-2);color:var(--fg);box-shadow:inset 0 1px 0 var(--glass-hi)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{aspect-ratio:1;max-width:100%;border-radius:50%;font-weight:700;font-size:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.daypick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tpl{border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:600;font-size:14px}
.tpl .emo{text-align:left;width:auto;font-size:24px}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:42px;height:42px;border-radius:12px;font-size:21px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.emojis button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-family:var(--num);font-size:28px;font-weight:600;min-width:34px;text-align:center}
.btn{border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--glass-2);border:1px solid var(--line);text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn.danger.arm{background:var(--crit);color:#fff;border-color:var(--crit)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:100px}
.inrow{display:flex;gap:10px;align-items:center}
.inrow .tinput{flex:1}

/* Mehr */
textarea.area{width:100%;min-height:170px;resize:vertical;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13.5px;line-height:1.5;outline:none}
textarea.area:focus{border-color:var(--accent)}
.pday{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pday:first-child{border-top:0}
.pday b{font-weight:700;color:var(--muted)}
.pday ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;min-width:0}
.pday li{overflow-wrap:anywhere}
.pday li .num{color:var(--accent);margin-right:6px;font-size:15px;font-weight:600}
code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:6px}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--green)}.sync.busy i{background:var(--amber)}.sync.err i{background:var(--crit)}

/* Training */
.tabbar.six{grid-template-columns:repeat(6,1fr);padding:5px}
.tabbar.six .tab{font-size:10.5px;gap:2px;padding:8px 0 6px}
.tabbar.six .tab svg{width:22px;height:22px}
.tpl-big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;width:100%;border-radius:var(--r-lg);padding:15px 16px}
.tpl-big b{font-size:17px}.tpl-big>span{font-size:13.5px;color:var(--muted)}
.tsheet .tpl-big{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.ttags{display:flex;flex-wrap:wrap;gap:6px}
.ttag{--c:var(--accent);display:inline-block;max-width:100%;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--c) var(--ta,17%),transparent);color:var(--c)}
.ttag.rest{background:rgba(255,255,255,.06);color:var(--faint)}
.tpl-big .ttag{font-size:12px;padding:4px 8px}
.twk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.twd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 9px;border-radius:14px;min-width:0;color:var(--fg)}
.twd small{font-size:11px;font-weight:650;color:var(--muted)}
.twd b{font-size:20px;font-weight:600;line-height:1}
.twd.t small,.twd.t b{color:var(--accent)}
.twd.sel{background:rgba(255,255,255,.08);outline:1px solid rgba(255,255,255,.16)}
.twd .ttag{font-size:9.5px;padding:2px 4px}
.trun{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%}
.thero{--c:var(--accent);border-radius:var(--r-lg);padding:16px 16px 15px;display:flex;flex-direction:column;gap:10px;
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 15%,transparent),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.thero.rest{--c:#8A9391}
.thero .label{color:var(--c)}
.thero h3{margin:0;font-size:25px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.thero h3 small{font-size:16px;font-weight:600;color:var(--muted)}
.thero .meta{font-size:13.5px;color:var(--muted)}
.thero .exl{display:flex;flex-direction:column;gap:3px;font-size:14px;color:#C9D1CF}
.thero .pill{align-self:flex-start}
.thero.run .btn.pri{background:var(--c);border-color:var(--c);color:#06140F}
.mbars{display:flex;flex-direction:column;gap:9px}
.mbar{display:grid;grid-template-columns:78px 1fr 52px;align-items:center;gap:10px;font-size:13.5px}
.mbar .tr{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.mbar .tr i,.mbar .tr s{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent);text-decoration:none}
.mbar .tr s{background:rgba(70,224,174,.28)}
.mbar .tr u{position:absolute;top:-2px;bottom:-2px;border-left:1px dashed rgba(255,255,255,.4);border-right:1px dashed rgba(255,255,255,.4);background:rgba(255,255,255,.04)}
.mbar b{font-size:17px;text-align:right}.mbar b small{font-size:12px;color:var(--muted)}
.mbar.lo span{color:var(--amber)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgrid .btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px}
.tgrid .btn small{font-size:12px;font-weight:500;color:var(--muted)}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.tday{--c:var(--accent);display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border-radius:var(--r-md)}
.tday .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-size:18px}
.tday .ic svg{width:22px;height:22px}
.tday .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tday .tx b{font-size:16px;font-weight:700}
.tday .tx span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tday .go{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;background:var(--c);color:#06140F;flex:none}
.tday.ok .go{background:rgba(255,255,255,.08);color:var(--c);width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:16px}
.tday.ok .tx b{opacity:.75}
/* Trainingsmodus */
.tclock{color:var(--muted)}
.texc{border-radius:var(--r-lg);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.texc.cur{outline:1px solid rgba(70,224,174,.38)}
.texh{display:flex;align-items:flex-start;gap:8px}
.texh .nm{flex:1;min-width:0;font-size:17px;font-weight:750;letter-spacing:-.01em;text-align:left}
.texh .nm small{font-size:12.5px;font-weight:600;color:var(--muted)}
.tib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:15px;color:var(--muted);flex:none;font-weight:700}
.tib.big{width:40px;height:40px}
.tlast{font-size:12.5px;color:var(--muted)}
.tsug{font-size:13.5px;font-weight:650;color:var(--accent)}
.tnote{font-size:12.5px;color:#B9C2C0;font-style:italic}
.tplat{font-size:12.5px;color:var(--amber);background:rgba(242,169,59,.09);border:1px solid rgba(242,169,59,.25);border-radius:12px;padding:8px 10px}
.tsets{display:flex;flex-direction:column;gap:6px}
.tsrow{display:grid;grid-template-columns:20px 1fr 1fr 44px;align-items:center;gap:8px}
.tsrow .no{font-size:17px;color:var(--faint);text-align:center}
.tsrow label{display:flex;align-items:baseline;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:11px;padding:0 10px;min-height:44px;min-width:0}
.tsrow input{width:100%;min-width:0;background:transparent;border:0;outline:none;font-family:var(--num);font-size:22px;color:var(--fg);padding:8px 0}
.tsrow label span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tsrow .ck{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.22);display:grid;place-items:center;color:transparent;justify-self:end}

const frac=(h,d)=>Math.min(1,hv(h,d)/tgt(h));
function weekCount(h,ws,until){let c=0;for(let i=0;i<7;i++){const d=addDays(ws,i);if(until&&d>until)break;if(isDone(h,d))c++}return c}

  if(h.freq==='daily'){let d=t,n=0;if(scheduled(h,t)&&!isDone(h,t))d=addDays(t,-1);
    for(let i=0;i<3700&&d>=h.created;i++){if(!scheduled(h,d)){d=addDays(d,-1);continue}if(!isDone(h,d))break;n++;d=addDays(d,-1)}return n}
  let ws=weekStart(t);if(weekCount(h,ws,t)<h.target)ws=addDays(ws,-7);let n=0;
  for(let i=0;i<530&&addDays(ws,6)>=h.created&&weekCount(h,ws,t)>=h.target;i++){n++;ws=addDays(ws,-7)}return n}

  if(h.freq==='daily'){for(let d=h.created,i=0;d<=t&&i<3700;d=addDays(d,1),i++){if(!scheduled(h,d))continue;if(isDone(h,d)){cur++;best=Math.max(best,cur)}else if(d<t)cur=0}return best}
  for(let ws=weekStart(h.created),i=0;ws<=t&&i<530;ws=addDays(ws,7),i++){if(weekCount(h,ws,t)>=h.target){cur++;best=Math.max(best,cur)}else if(addDays(ws,6)<t)cur=0}return best}

  for(let i=1;i<=dim;i++){const d=`${M}-${pad(i)}`;if(d>t||d<h.created||!scheduled(h,d))continue;el++;if(isDone(h,d))hit++}return el?Math.round(hit/el*100):0}

/* ---------- storage + login (Firebase) ----------
   Local copy per account in localStorage; Firestore keeps it in sync across devices.
   Every local change bumps rev[key]. A key is only replaced from the server when nothing local is waiting. */
const LSK_BASE='sabrly-v1:',LAST_KEY='sabrly-last';
let auth=null,fs=null,USER=null,MODE='guest',ADOPT=false,unsub=null;
let SYNC='local',cloudReady=false,flushT=null,outstanding=0,hadErr=false;
const rev={},saved={};
const pendingKeys=()=>Object.keys(rev).filter(k=>rev[k]!==saved[k]);
const localPending=k=>rev[k]!==undefined&&rev[k]!==saved[k];
const lsKey=()=>LSK_BASE+(USER?USER.uid:'guest');
const getLast=()=>{try{return localStorage.getItem(LAST_KEY)}catch(e){return null}};
const setLast=v=>{try{if(v)localStorage.setItem(LAST_KEY,v);else localStorage.removeItem(LAST_KEY)}catch(e){}};
function saveLocal(){try{localStorage.setItem(lsKey(),JSON.stringify({S,LOGS}))}catch(e){}}
function loadLocal(key){try{const r=JSON.parse(localStorage.getItem(key||lsKey())||'null');if(r&&r.S){S=normalize(r.S);LOGS=r.LOGS&&typeof r.LOGS==='object'?r.LOGS:{};return true}}catch(e){}return false}
function resetRev(){for(const k of Object.keys(rev))delete rev[k];for(const k of Object.keys(saved))delete saved[k];outstanding=0;hadErr=false}
function touch(k,delay=450){rev[k]=(rev[k]||0)+1;saveLocal();if(!USER)return;clearTimeout(flushT);flushT=setTimeout(flush,delay)}
const dataCol=()=>fs.collection('users').doc(USER.uid).collection('data');
function flush(){
  if(!USER||!fs||!cloudReady)return;
  const ks=pendingKeys();if(!ks.length)return;
  hadErr=false;setSync(navigator.onLine===false?'offline':'saving');
  const uid=USER.uid;
  for(const k of ks){const r=rev[k],body=k==='state'?S:LOGS[k];saved[k]=r;if(!body)continue;
    outstanding++;
    // Firestore queues the write offline and sends it as soon as there is a connection
    dataCol().doc(k).set(clone(body)).then(()=>{outstanding--;if(USER&&USER.uid===uid&&!outstanding&&!hadErr&&!pendingKeys().length)setSync('cloud')})
      .catch(e=>{outstanding--;if(USER&&USER.uid===uid)fail(e)})}}
function fail(e){hadErr=true;setSync('err');const c=e&&e.code;
  toast(c==='resource-exhausted'?'Tageslimit des kostenlosen Speichers erreicht. Lokal ist alles gesichert.':c==='permission-denied'?'Keine Berechtigung. Melde dich bitte neu an.':'Speichern hat nicht geklappt. Deine Einträge sind auf diesem Gerät gesichert.')}
function setSync(s){SYNC=s;const el=document.getElementById('syncline');if(el)el.outerHTML=syncHTML()}
function syncHTML(){const m={cloud:['ok','Synchronisiert · auf all deinen Geräten'],saving:['busy','Speichert …'],loading:['busy','Lädt deine Daten …'],
  slow:['busy','Server antwortet noch nicht. Einträge sind lokal gesichert.'],offline:['busy','Offline · wird synchronisiert, sobald du online bist'],
  err:['err','Speichern fehlgeschlagen. Lokal gesichert.'],local:['','Ohne Konto · nur auf diesem Gerät gespeichert']}[SYNC]||['',''];
  return `<span class="sync ${m[0]}" id="syncline"><i></i>${m[1]}</span>`}
function applyDoc(k,raw){const data=clone(raw);if(!data)return false;
  if(k==='garmin'){if(JSON.stringify(data)===JSON.stringify(GST))return false;GST=data;return true}
  if(k==='state'){const n=normalize(data);if(JSON.stringify(n)===JSON.stringify(S))return false;S=n;return true}
  if(k.startsWith('m-')){const n=data.days?data:{days:{}};if(JSON.stringify(n)===JSON.stringify(LOGS[k]))return false;LOGS[k]=n;return true}
  return false}
function stopCloud(){if(unsub){try{unsub()}catch(e){}}unsub=null;cloudReady=false;clearTimeout(flushT);GST=null}
function startCloud(){
  stopCloud();SYNC='loading';let first=true;const uid=USER.uid;
  const timer=setTimeout(()=>{if(SYNC==='loading')setSync(navigator.onLine===false?'offline':'slow')},10000);
  unsub=dataCol().onSnapshot({includeMetadataChanges:true},snap=>{
    try{
      if(!USER||USER.uid!==uid)return;
      if(snap.metadata.hasPendingWrites)return; // echo of our own write
      if(first&&snap.metadata.fromCache){
        for(const doc of snap.docs){if(!localPending(doc.id))applyDoc(doc.id,doc.data())}
        renderIdle();return}
      if(first){first=false;clearTimeout(timer);
        const cloudKeys=new Set();
        for(const doc of snap.docs){const k=doc.id,data=clone(doc.data());cloudKeys.add(k);
          if(k==='state'){if(!localPending('state')||!ADOPTED){S=normalize(data);saved.state=rev.state}}
          else if(k==='garmin')GST=data;
          else if(k.startsWith('m-')){const local=LOGS[k],merged={days:{...((data&&data.days)||{})}};
            if(localPending(k)&&local?.days)for(const[d,e]of Object.entries(local.days))merged.days[d]={...(merged.days[d]||{}),...clone(e)};
            LOGS[k]=merged}}
        if(!cloudKeys.has('state')&&(S.todos.length||S.plan.text||Object.keys(LOGS).length||localPending('state')))rev.state=(rev.state||0)+1;
        for(const k of Object.keys(LOGS))if(!cloudKeys.has(k))rev[k]=(rev[k]||0)+1;
        ADOPTED=false;cloudReady=true;SYNC='cloud';saveLocal();renderIdle();if(pendingKeys().length)flush();return}
      let changed=false;

      if(changed){saveLocal();renderIdle()}
    }catch(err){console.error(err)}
  },err=>{clearTimeout(timer);setSync('err');cloudReady=false});
}
let ADOPTED=false;
function enterAccount(u){
  const guest=ADOPT&&!USER?{S:clone(S),LOGS:clone(LOGS)}:null;ADOPT=false;
  stopCloud();USER={uid:u.uid,email:u.email||''};setLast(u.uid);MODE='cloud';resetRev();
  S=defaultState();LOGS={};loadLocal();
  if(guest){S=normalize(guest.S);LOGS=guest.LOGS||{};rev.state=1;for(const k of Object.keys(LOGS))rev[k]=1;ADOPTED=true;
    try{localStorage.removeItem(LSK_BASE+'guest')}catch(e){};saveLocal()}
  UI.auth=null;UI.fromGuest=false;startCloud();UI.page=null;UI.stack=[];render('enter')}
function leaveAccount(){const old=USER;stopCloud();USER=null;resetRev();S=defaultState();LOGS={};
  if(old){try{localStorage.removeItem(LSK_BASE+old.uid)}catch(e){}}setLast(null);SYNC='local'}
async function boot(){
  const hasFb=!!(window.firebase&&window.FIREBASE_CONFIG);
  const last=getLast();
  if(!hasFb){MODE='guest';SYNC='local';loadLocal(LSK_BASE+'guest');render(true);return}
  try{firebase.initializeApp(window.FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
    try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}}catch(e){console.error(e);MODE='guest';loadLocal(LSK_BASE+'guest');render(true);return}
  // show the last state right away, the login check follows a moment later
  if(last==='guest'){MODE='guest';SYNC='local';loadLocal(LSK_BASE+'guest')}
  else if(last){MODE='cloud';USER={uid:last,email:''};loadLocal();SYNC='loading'}
  else MODE='auth';
  render(true);
  auth.onAuthStateChanged(u=>{
    try{
      if(u){if(USER&&USER.uid===u.uid&&unsub){USER.email=u.email||'';return}enterAccount(u);return}
      if(USER)leaveAccount();
      if(MODE!=='guest'){MODE='auth';UI.page=null;UI.stack=[];render('enter')}
    }catch(e){console.error(e)}
  });
}

function tabsRender(){const nav=$('#tabbar');if(!nav)return;const six=!!S.settings.statTab,L=six?['heute','habits','training','aufgaben','statistik','mehr']:['heute','habits','training','aufgaben','mehr'],key=L.join();
  if(nav.dataset.k!==key){nav.dataset.k=key;nav.className='tabbar glass'+(six?' six':'');nav.innerHTML=L.map(t=>`<button class="tab" data-a="tab" data-t="${t}" id="tab-${t}">${TABIC[t]}${TABN[t]}</button>`).join('')}}
function ring(p,size=56,g=null){const r=size/2-5,c=2*Math.PI*r,r2=r-7,c2=2*Math.PI*r2,m=size/2;
  const gold=g==null?'':`<circle cx="${m}" cy="${m}" r="${r2}" fill="none" stroke="rgba(227,190,118,.16)" stroke-width="3"/><circle class="gring" cx="${m}" cy="${m}" r="${r2}" fill="none" stroke="${GOLD}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c2}" stroke-dashoffset="${c2*(1-g)}" transform="rotate(-90 ${m} ${m})"/>`;
  return `<div class="ring${g==null?'':' hasg'}" style="width:${size}px;height:${size}px"${g==null?'':` title="Gebets-Pünktlichkeit ${Math.round(g*100)} %"`}><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CF0C8"/><stop offset="1" stop-color="#2FB98C"/></linearGradient></defs><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${m} ${m})"/>${gold}</svg><b>${Math.round(p*100)}</b></div>`}
function swipeRow(front,actions){return `<div class="swipe" data-swipe><div class="swipe-actions">${actions}</div><div class="swipe-front">${front}</div></div>`}
const sa=(cls,a,attrs,icon,label)=>`<button type="button" class="sa ${cls}" data-a="${a}" ${attrs}><i>${icon}</i>${label}</button>`;
function dayTitle(d){const t=today();return d===t?'Heute':d===addDays(t,1)?'Morgen':d===addDays(t,-1)?'Gestern':fmtShort(d)}
const daysLabel=h=>h.freq==='weekly'||!h.days||h.days.length>=7?'':h.days.length===5&&[0,1,2,3,4].every(i=>h.days.includes(i))?'Mo–Fr':h.days.map(i=>DN[i]).join(', ');

/* --- Heute --- */
const curSel=()=>UI.sel||today();
function vHeute(){
  const t=today(),sel=curSel(),fut=sel>t,ws=weekStart(sel),e=dayGet(sel)||{},sd=pdate(sel);
  let days='';
  for(let i=0;i<7;i++){const d=addDays(ws,i),f=d>t;days+=`<button type="button" class="day${d===t?' today':''}${d===sel?' sel':''}${f?' fut':''}" data-a="sel" data-d="${d}" aria-label="${fmtLong(d)}"><span class="dn">${DN[i]}</span><span class="dd">${pdate(d).getDate()}</span><span class="db"><i style="width:${f?0:Math.round(dayScore(d)*100)}%"></i></span></button>`}
  let h=`<header class="weekbar glass" data-wswipe><div class="wb-in"><div class="mon"><b>${MS[sd.getMonth()].toUpperCase()}</b><span>${sd.getFullYear()}</span></div><div class="days">${days}</div>${ring(fut?0:dayScore(sel),56,fut?null:(prayerDay(sel)?.avg??null))}</div></header>`;
  // kleine Kopfzeile (Name, Tag, Datum), die Pfeile wechseln den Tag
  const un=S.settings.userName,hr=new Date().getHours(),gr=hr>=5&&hr<11?'Guten Morgen':hr>=17&&hr<23?'Guten Abend':'Hallo';
  h+=`<div class="titlebar"><div class="tb-l">${sel===t&&un?`<div class="eyebrow">${gr}, ${esc(un)}</div>`:''}<div class="tb-row"><h1>${dayTitle(sel)}</h1><span class="sub">${fmtMid(sel)}</span></div></div><div class="wknav"><button type="button" class="rbtn" data-a="dstep" data-dir="-1" aria-label="Vorheriger Tag">‹</button><button type="button" class="rbtn" data-a="dstep" data-dir="1" aria-label="Nächster Tag">›</button></div></div>`;
  if(sel!==t)h+=`<button type="button" class="link" data-a="sel" data-d="${t}" style="align-self:flex-start;margin-top:-22px">Zurück zu heute ›</button>`;
  // Vers/Satz des Tages direkt darunter, als Erstes im Blick (nur wenn es welche gibt)
  const qq=pickQuote(sel);if(qq)h+=quoteHTML(qq,sel);
  if(fut)h+=`<div class="futnote">Hier planst du voraus. Abhaken geht ab ${sel===addDays(t,1)?'morgen':'diesem Tag'}.</div>`;
  // one situation box at most
  if(sel===t)h+=situationBox(t);
  if(sel===t)h+=weekCardHeute(t);
  // mood
  // habits
  const hs=active(sel),open=hs.filter(x=>!isDone(x,sel)).length;
  h+=`<section class="sec hl"><div class="sec-h"><div class="row"><h2>Habits</h2><span class="pill num" style="font-size:14px">${fut?hs.length+' geplant':open+' offen'}</span></div><div class="right">${hs.length?`<button type="button" class="mini" data-a="hnew" aria-label="Habit erstellen">+</button>`:''}<button type="button" class="link" data-a="tab" data-t="habits">Alle ›</button></div></div>`;
  h+=hs.length?hs.map(x=>habitRow(x,sel,fut)).join(''):`<button type="button" class="addrow glass press" data-a="hnew"><span class="emo">✨</span>${S.habits.some(x=>!x.archived)?'Keine Habits an diesem Tag · Habit erstellen':'Ersten Habit erstellen'}<span class="plusic">+</span></button>`;
  h+=`</section>`;
  // todos
  const td=dayTodos(sel),openTd=td.filter(x=>!x.done).length;
  h+=`<section class="sec hl"><div class="sec-h"><div class="row"><h2>Aufgaben</h2><span class="pill num" style="font-size:14px">${openTd} offen</span></div><div class="right">${td.length?`<button type="button" class="mini" data-a="tnew" data-d="${sel===t?'':sel}" aria-label="Aufgabe hinzufügen">+</button>`:''}<button type="button" class="link" data-a="tab" data-t="aufgaben">Alle ›</button></div></div>${td.length?td.map(x=>todoRow(x,fut)).join(''):`<button type="button" class="addrow glass press" data-a="tnew" data-d="${sel===t?'':sel}"><span class="emo">📝</span>${sel===t?'Aufgabe hinzufügen':'Aufgabe für '+esc(dayTitle(sel))}<span class="plusic">+</span></button>`}</section>`;
  h+=heuteTraining(sel);
  // Rückblick: Stimmung + ein Satz zum Tag
  if(!fut)h+=`<section class="sec"><h2>Rückblick</h2><div class="card glass stack" id="moodcard" style="gap:10px;position:relative"><span class="label">Wie war ${sel===t?'dein':'der'} Tag?</span>
      <div class="mood${e.mood?' set':''}">${MOODS.map((m,i)=>`<button type="button" class="${e.mood===i+1?'on':''}" data-a="mood" data-d="${sel}" data-v="${i+1}" aria-label="Stimmung ${i+1} von 5" aria-pressed="${e.mood===i+1}">${m}</button>`).join('')}</div>
      <input class="field" id="f-okay" data-f="okay" data-d="${sel}" value="${esc(e.okay||'')}" placeholder="Ein Satz dazu (optional)" autocomplete="off" enterkeyhint="done"><span class="saved" data-saved="okay" style="position:absolute;top:16px;right:18px;min-height:0"></span></div></section>`;
  // Notizen
  const notes=Array.isArray(e.n)?e.n:[];
  h+=`<section class="sec"><div class="sec-h"><h2>Notizen</h2>${notes.length?`<span class="pill num" style="font-size:14px">${notes.length}</span>`:''}</div><div class="card glass" style="padding:10px 16px 12px">
    <ul class="nlist" id="nlist">${notes.map(n=>noteLi(n,sel)).join('')}</ul>
    <div class="nadd"><span class="nb">•</span><input class="field" id="f-note" data-note="1" data-d="${sel}" placeholder="Notiz hinzufügen …" autocomplete="off" enterkeyhint="enter" maxlength="300"><button type="button" class="nplus" data-a="nadd" data-d="${sel}" aria-label="Notiz hinzufügen">+</button></div>
  </div></section>`;
  // Tagesablauf
  const tl=timeline(sel);
  if(tl.length)h+=`<section class="sec"><div class="sec-h"><h2>Tagesablauf</h2><button type="button" class="link" data-a="tab" data-t="mehr">Plan bearbeiten ›</button></div><div class="card glass" style="padding:6px 16px"><div class="tl">${tl.map(it=>tlItem(it,sel,fut)).join('')}</div></div></section>`;
  return h}
const noteLi=(n,d)=>`<li data-nid="${esc(n.id)}"><span class="nb">•</span><span class="nt">${esc(n.t)}</span><button type="button" class="nx" data-a="ndel" data-d="${d}" data-id="${esc(n.id)}" aria-label="Notiz löschen">✕</button></li>`;
function addNote(d,input){const v=(input.value||'').trim();if(!v)return;const e=dayEnsure(d);if(!Array.isArray(e.n))e.n=[];const n={id:'n-'+newId(),t:v.slice(0,300)};e.n.push(n);touch(mkey(d),300);
  input.value='';const ul=$('#nlist');if(ul)ul.insertAdjacentHTML('beforeend',noteLi(n,d));}
function dayHash(d){let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;return h}
function quoteHTML(q,d){const v=q.type==='vers',L=q.t.length;
  return `<button type="button" class="quote${v?' vers':''}" data-a="qnext" data-d="${d}" aria-label="Nächster Spruch"><span class="qh-mark" aria-hidden="true">”</span><span class="qh-top"><span class="qh-lab">${v?'Vers':'Satz'} des Tages</span>${S.quotes.length>1?'<span class="qh-more" aria-hidden="true">↻</span>':''}</span><span class="qt${L>170?' l':L>85?' m':''}">${esc(q.t)}</span>${q.src?`<span class="qs">— ${esc(q.src)}</span>`:''}</button>`}
function pickQuote(d){const n=S.quotes.length;if(!n)return null;return S.quotes[(dayHash(d)+(UI.qOff[d]||0))%n]}
function situationBox(t){const on=S.settings.sit.on,sent=k=>on?`<span class="bs">${esc(sitText(k))}</span>`:'';
  const y=addDays(t,-1);
  const missed=active(y).filter(x=>x.freq==='daily'&&!isDone(x,y)&&!isDone(x,t));
  if(missed.length){const twice=missed.filter(x=>{let d=addDays(y,-1);for(let i=0;i<7&&!scheduled(x,d);i++)d=addDays(d,-1);return x.created<=d&&scheduled(x,d)&&!isDone(x,d)});
    return twice.length?`<div class="banner sit crit" data-sit="missed2"><b>Zweimal in Folge ausgelassen:</b> ${esc(twice.map(x=>x.name).join(', '))}.${sent('missed2')}</div>`
      :`<div class="banner sit" data-sit="missed1"><b>Gestern ausgelassen:</b> ${esc(missed.map(x=>x.name).join(', '))}.${sent('missed1')}</div>`}
  if(!on)return '';
  const act=active(t);if(!act.length)return '';
  let best=null;for(const x of act){if(x.freq==='daily'&&!isDone(x,t))continue;if(x.freq==='weekly'&&weekCount(x,weekStart(t),t)<x.target)continue;const st=streak(x);if(st>=3&&st===bestStreak(x)&&(!best||st>best.st))best={x,st}}
  if(best){const u=best.x.freq==='weekly'?(best.st===1?'Woche':'Wochen'):'Tage';return `<div class="banner sit good" data-sit="best"><b>Neue Bestserie: ${best.st} ${u} ${esc(best.x.name)}.</b>${sent('best')}</div>`}
  const daily=act.filter(x=>x.freq==='daily'),sc=dayScore(t),hr=new Date().getHours(),ds=S.settings.dayStart||0;
  if(daily.length&&daily.every(x=>isDone(x,t)))return `<div class="banner sit good" data-sit="done"><b>Alle Habits erledigt.</b>${sent('done')}</div>`;
  const open=daily.filter(x=>!isDone(x,t)).length;
  if(daily.length&&(hr>=19||hr<ds))return `<div class="banner sit neutral" data-sit="evening"><b>Noch ${open} ${open===1?'Habit':'Habits'} offen.</b>${sent('evening')}</div>`;
  if(daily.length&&sc===0&&hr>=4&&hr<12)return `<div class="banner sit neutral" data-sit="morning"><b>Noch nichts abgehakt.</b>${sent('morning')}</div>`;
  return ''}
function dayTodos(sel){const t=today();
  const L=sel===t?S.todos.filter(x=>(!x.done&&(!x.due||x.due<=t))||(x.done&&x.doneAt===t&&(!x.due||x.due<=t))):S.todos.filter(x=>x.due===sel);
  return L.sort(todoSort)}
function timeline(d){const items=[];
  (S.plan.days?.[wd(d)]||[]).forEach((it,i)=>items.push({k:'plan',time:validTime(it.t?.slice(0,5))||'',label:it.t||'',x:it.x,i}));
  active(d).filter(h=>h.time).forEach(h=>items.push({k:'habit',time:h.time,label:h.time,h}));
  S.todos.filter(x=>x.time&&(x.due===d||(!x.due&&d===today()))).forEach(x=>items.push({k:'todo',time:x.time,label:x.time,x}));
  return items.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function tlItem(it,d,fut){const dis=fut?'disabled':'';
  if(it.k==='plan'){const dn=(dayGet(d)?.p||[]).includes(it.i);return `<div class="tl-item${dn?' done':''}"><span class="t num${it.label?'':' none'}">${esc(it.label||'–')}</span><span class="ic">🗓️</span><span class="x2">${esc(it.x)}</span><button type="button" class="check${dn?' on':''}" data-a="ptick" data-d="${d}" data-i="${it.i}" aria-label="Erledigt" ${dis}>${dn?CHECK:''}</button></div>`}
  if(it.k==='habit'){const x=it.h,dn=isDone(x,d),T=tgt(x);return `<div class="tl-item${dn?' done':''}"><span class="t num">${esc(it.label)}</span><span class="ic">${esc(x.emoji)}</span><span class="x2">${esc(x.name)}${T>1?`<small>${hv(x,d)}/${T}</small>`:''}</span><button type="button" class="check${dn?' on':''}" data-a="hstep" data-h="${x.id}" data-d="${d}" aria-label="Abhaken" ${dis}>${dn?CHECK:''}</button></div>`}
  const x=it.x;return `<div class="tl-item${x.done?' done':''}"><span class="t num">${esc(it.label)}</span><span class="ic">📝</span><span class="x2">${esc(x.title)}</span><button type="button" class="check${x.done?' on':''}" data-a="tdone" data-id="${x.id}" aria-label="Erledigt" ${dis}>${x.done?CHECK:''}</button></div>`}

function habitRow(x,d,locked){
  const v=hv(x,d),T=tgt(x),dn=v>=T,raw=hraw(x,d),dis=locked?'disabled':'';
  const bits=[];if(x.time)bits.push(x.time);
  if(x.freq==='weekly')bits.push(`${weekCount(x,weekStart(d),d)}/${x.target} diese Woche`);else if(T>1&&!locked)bits.push(`${v}/${T}`);
  if(locked)bits.push('geplant');
  const pd=isPrayerH(x)?prayerDay(d):null;
  if(pd&&pd.avg!=null)bits.push(`Pünktlich ${Math.round(pd.avg*100)} %`);
  const sub=bits.join(' · ');
  let ctrl='',below='';
  if(x.freq==='daily'&&x.labels?.length){const on=Array.isArray(raw)?raw:[];
    below=`<div class="chips">${x.labels.map((l,i)=>{const it=pd&&pd.items[i],wait=it&&it.st==='wait'&&!on.includes(i);
      const cls=(on.includes(i)?' on':'')+(wait?' plock':'')+(it&&it.st==='miss'?' pmiss':'');
      const extra=it?` data-p="1"${wait?` data-from="${it.s}"`:''} aria-label="${esc(l)}${it.sc!=null&&it.tk?', '+it.sc+' %':''}${wait?', ab '+hm(it.s):''}"`:'';
      return `<button type="button" class="chip${cls}" data-a="lab" data-h="${x.id}" data-d="${d}" data-i="${i}" aria-pressed="${on.includes(i)}"${extra} ${dis||(wait?'disabled':'')}>${esc(l)}${it&&it.tk?`<span class="pb" style="width:${it.sc}%"></span>${it.ed?'<i class="pe">✎</i>':''}`:''}</button>`}).join('')}</div>`;
    if(pd&&d===today()){const st=prayerStatus(d),py=prayerDay(addDays(d,-1));
      if(st)below+=`<div class="pstat" data-pd="${d}">${esc(st)}</div>`;
      if(py&&py.items[4].st==='now')below+=`<button type="button" class="link pyest" data-a="lab" data-h="${x.id}" data-d="${addDays(d,-1)}" data-i="4">${esc(pLabel(4))} von gestern abhaken</button>`}
    if(isPrayerH(x)&&!PS().city)below+=`<button type="button" class="link pyest" data-a="pcity" data-m="home">Stadt für Gebetszeiten wählen ›</button>`;
    ctrl=`<span class="circle${dn?' on':''}" aria-hidden="true">${dn?CHECK:`<span class="num" style="font-size:15px;font-weight:600">${v}</span>`}</span>`}
  else if(x.freq==='daily'&&T>1){
    ctrl=`<div class="counter"><button type="button" class="cbtn" data-a="dec" data-h="${x.id}" data-d="${d}" aria-label="Weniger" ${dis}>−</button><button type="button" class="cbtn plus" data-a="inc" data-h="${x.id}" data-d="${d}" aria-label="Mehr" ${dis}>+</button></div>`;
    below=`<div class="dots">${Array.from({length:T},(_,i)=>`<i class="${i<v?'on':''}"></i>`).join('')}</div>`}
  else ctrl=`<button type="button" class="circle${dn?' on':''}" data-a="tog" data-h="${x.id}" data-d="${d}" aria-label="${esc(x.name)} abhaken" aria-pressed="${dn}" ${dis}>${dn?CHECK:''}</button>`;
  return `<div class="hrow glass${dn?' done':''}${locked?' locked':''}"><div class="top"><span class="emo">${esc(x.emoji||'•')}</span><span class="hname">${esc(x.name)}${sub?`<small>${esc(sub)}</small>`:''}</span>${ctrl}</div>${below}</div>`}

/* --- Habits --- */
function vHabits(){const t=today();
  const list=S.habits.filter(x=>!x.archived),arch=S.habits.filter(x=>x.archived),st=!S.settings.statTab&&UI.hseg==='s';
  let h=`<div class="sec-h" style="margin-top:6px"><h1>${st?'Statistik':'Habits'}</h1>${st?'':UI.hsort&&list.length>1?`<button type="button" class="txtbtn pri" data-a="hsort">Fertig</button>`:`<div class="row" style="gap:8px">${list.length>1?`<button type="button" class="iconbtn glass" data-a="hsort" aria-label="Reihenfolge ändern">${SORTIC}</button>`:''}<button type="button" class="iconbtn glass" data-a="hnew" aria-label="Neuer Habit">+</button></div>`}</div>`;
  if(!S.settings.statTab)h+=`<div class="seg" style="margin-top:-14px"><button type="button" class="${st?'':'on'}" data-a="hseg" data-v="h">Habits</button><button type="button" class="${st?'on':''}" data-a="hseg" data-v="s">Statistik</button></div>`;
  if(st)return h+vStats(true);

  else h+=`<span class="hint" style="margin-top:-10px">Tippen für Details · nach links wischen zum Ändern, Archivieren oder Löschen</span>`;
  for(const x of list){const wk=x.freq==='weekly',sch=scheduled(x,t),v=wk?weekCount(x,weekStart(t),t):hv(x,t),T=wk?x.target:tgt(x),dn=v>=T,s=streak(x);
    const meta=[x.time,daysLabel(x)].filter(Boolean).join(' · ');
    h+=swipeRow(`<div class="hcard solid press" data-a="hopen" data-h="${x.id}" role="button" tabindex="0" aria-label="${esc(x.name)} öffnen">
      <div class="row"><span class="emo">${esc(x.emoji||'•')}</span><span class="hname">${esc(x.name)}${meta?`<small>${esc(meta)}</small>`:''}</span>${sch||wk?`<button type="button" class="circle${dn?' on':''}" data-a="quick" data-h="${x.id}" aria-label="Heute abhaken">${dn?CHECK:''}</button>`:`<span class="pill">heute frei</span>`}</div>
      <div class="row between" style="align-items:flex-end"><div class="row" style="gap:8px;align-items:baseline"><span class="bignum">${v}<small> / ${T}</small></span><span class="hsub">${wk?'Wochenziel':'Heutiges Ziel'}</span></div><span class="flame">🔥 ${s}</span></div>
      <div class="bar"><i style="width:${Math.round(Math.min(1,v/T)*100)}%"></i></div></div>`,
      sa('sa-del','hdelq',`data-h="${x.id}"`,IC.del,'Löschen')+sa('sa-arch','harchq',`data-h="${x.id}"`,IC.arch,'Archiv')+sa('sa-edit','heditq',`data-h="${x.id}"`,IC.edit,'Ändern'))}
  if(arch.length){h+=`<button type="button" class="link" data-a="togarch" style="align-self:flex-start">${UI.showArch?'Archiv ausblenden':'Archiv anzeigen ('+arch.length+')'}</button>`;
    if(UI.showArch)h+=arch.map(x=>swipeRow(`<div class="todo solid press" data-a="hopen" data-h="${x.id}" role="button" tabindex="0"><span class="emo">${esc(x.emoji)}</span><span class="tt"><b>${esc(x.name)}</b><span>Archiviert</span></span></div>`,
      sa('sa-del','hdelq',`data-h="${x.id}"`,IC.del,'Löschen')+sa('sa-ok','harchq',`data-h="${x.id}"`,IC.undo,'Zurück'))).join('')}
  return h}

/* --- calendars --- */
function monthNav(M,a){const [yy,mm]=M.split('-').map(Number);return `<div class="row between"><button type="button" class="rbtn" data-a="${a}" data-dir="-1" aria-label="Vorheriger Monat">‹</button><h2 style="font-size:19px">${MN[mm-1]} ${yy}</h2><button type="button" class="rbtn" data-a="${a}" data-dir="1" aria-label="Nächster Monat">›</button></div>`}
function calCells(M,fn){const [yy,mm]=M.split('-').map(Number),first=`${M}-01`,dim=new Date(yy,mm,0).getDate();
  let cells=DN.map(d=>`<span class="wd">${d}</span>`).join('');
  for(let i=0;i<wd(first);i++)cells+=`<span class="mcell blank"></span>`;
  for(let i=1;i<=dim;i++)cells+=fn(`${M}-${pad(i)}`,i);
  return `<div class="cal">${cells}</div>`}
function habitCal(x,M){const t=today();return calCells(M,(d,i)=>{
  let cls='mcell',p=Math.round(frac(x,d)*100);const td=d===t?' today':'';

function vStats(noHead){const t=today(),hs=S.habits.filter(x=>!x.archived);

  const A=avgOf(ws),B=avgOf(lw);
  let bars='';for(let i=0;i<7;i++){const d=addDays(ws,i),f=d>t,p=f?0:Math.round(dayScore(d)*100),has=hasHabits(d);
    bars+=`<button type="button" class="bcol${d===t?' today':''}${f?' fut':''}" data-a="openday" data-d="${d}" aria-label="${fmtLong(d)}: ${f?'noch offen':p+' Prozent'}"><span class="bv">${f||!has?'':p+'%'}</span><span class="btrack"><i style="height:${p}%"></i></span><span class="bl">${DN[i]}</span></button>`}

  h+=`<div class="card glass stack" style="gap:16px"><div class="row between" style="align-items:flex-start"><div><h2>${curWk?'Diese Woche':'KW '+kw(ws)}</h2><span class="hint" style="font-size:13.5px">${dsd.getDate()}. ${MS[dsd.getMonth()]} – ${de.getDate()}. ${MS[de.getMonth()]}</span></div><div class="wknav"><button type="button" class="rbtn" data-a="statw" data-dir="-1" aria-label="Vorherige Woche">‹</button><button type="button" class="rbtn" data-a="statw" data-dir="1" aria-label="Nächste Woche">›</button></div></div>

    <div class="bars">${bars}</div></div>`;
  // month calendar
  const M=UI.statM||t.slice(0,7),[yy,mm]=M.split('-').map(Number),dim=new Date(yy,mm,0).getDate();
  let n=0,sum=0,full=0,act=0;for(let i=1;i<=dim;i++){const d=`${M}-${pad(i)}`;if(d>t||!hasHabits(d))continue;const sc=dayScore(d);n++;sum+=sc;if(sc>=1)full++;if(sc>0)act++}
  h+=`<div class="card glass stack" style="gap:14px"><h2>Monat</h2>${monthNav(M,'statm')}
    <div class="kpis"><div class="kpi glass"><b>${n?Math.round(sum/n*100):0}%</b><span>Ø erledigt</span></div><div class="kpi glass"><b>${full}</b><span>Tage mit 100&nbsp;%</span></div><div class="kpi glass"><b>${act}</b><span>Aktive Tage</span></div></div>

  // per habit
  h+=vPStats();

const DAYMAP={mo:0,montag:0,di:1,dienstag:1,mi:2,mittwoch:2,do:3,donnerstag:3,fr:4,freitag:4,sa:5,samstag:5,so:6,sonntag:6};
function parsePlan(text){const days={};let cur=null;
  for(let raw of String(text).split(/\r?\n/)){let line=raw.replace(/\*\*|__|^#+\s*/g,'').trim();if(!line)continue;
    const m=line.match(/^([A-Za-zÄÖÜäöü]+)\.?\s*(?:([:\-–(|])\s*)?(.*)$/);
    if(m&&DAYMAP[m[1].toLowerCase()]!==undefined&&(m[2]||!m[3])){cur=DAYMAP[m[1].toLowerCase()];days[cur]??=[];line=(m[2]==='('?'(':'')+(m[3]||'');if(!line.trim())continue}
    if(cur===null)continue;
    for(let part of line.split(/\s*;\s*/)){part=part.replace(/^[-•*]\s*/,'').trim();if(!part)continue;
      const tm=part.match(/^(\d{1,2})[:.](\d{2})(?:\s*[-–]\s*(\d{1,2})[:.](\d{2}))?\s*(?:Uhr)?\s*[:\-–]?\s*(.*)$/);
      if(tm)days[cur].push({t:pad(tm[1])+':'+tm[2]+(tm[3]?'–'+pad(tm[3])+':'+tm[4]:''),x:tm[5]||''});else days[cur].push({t:'',x:part})}}
  for(const k of Object.keys(days))if(!days[k].length)delete days[k];return days}

function cityFor(d){const P=PS(),t=P.travel;return t&&t.from<=d&&d<=t.until?t:P.city}
function timesFor(d){const c=cityFor(d);if(!c)return null;const z=PT[c.id];if(!z)return null;const a=z.days[d];if(!a)return null;
  const b=z.days[addDays(d,1)]||a;return {s:a+'|'+b.slice(0,4),c:c.id}}
function pzParse(s){if(!s||!/^\d{24}\|\d{4}$/.test(s))return null;const m=i=>+s.slice(i*4,i*4+2)*60+ +s.slice(i*4+2,i*4+4);

// Zeitfenster: [Beginn, Ende]. Asr endet für die Wertung „buf“ Minuten vor Maghrib, Isha bei Fajr
function pWin(z,i,buf){return [[z.F,z.S],[z.D,z.A],[z.A,z.M-buf],[z.M,z.I],[z.I,z.F2]][i]}
const lin=(x,x0,x1,y0,y1)=>x1<=x0?y1:y0+(y1-y0)*Math.min(1,Math.max(0,(x-x0)/(x1-x0)));
// Wertung 0–100 für ein Gebet zur Minute m (ab Mitternacht des Tages); null = noch nicht begonnen
function pScore(z,i,m,buf){
  if(i===0){if(m<z.F)return null;if(m>=z.S)return 10;const B1=z.S-40,B2=z.S-10;
    if(m<B1)return Math.round(lin(m,z.F,B1,50,100));if(m<B2)return 100;return Math.round(lin(m,B2,z.S,100,20))}
  if(i===4){if(m<z.I)return null;const N=z.M+(z.F2-z.M)/2,L=z.M+2*(z.F2-z.M)/3;
    if(m<N)return Math.round(lin(m,z.I,N,100,20));if(m<L)return 20;return 10}
  const [s,e]=pWin(z,i,buf);if(m<s)return null;if(m>=e)return 10;return Math.round(lin(m,s,e,100,20))}
function prayerDay(d){const P=PS();if(!P.on||!P.since||d<P.since)return null;const x=prayerHabit();if(!x||x.created>d||!scheduled(x,d))return null;

    if(tk){const m=pt[i];sc=m==null?10:(pScore(z,i,m,P.buf)??10);st='done'}else if(nm<s)st='wait';else if(nm<end)st='now';else{sc=0;st='miss'}
    return {i,s,end,sc,st,tk,m:pt[i],ed:!!pe[i]}});

function prayerSync(d,before,after){const e=dayEnsure(d);e.pt=e.pt&&typeof e.pt==='object'?e.pt:{};const nm=nowMin(d);

/* Haptik: Android über vibrate. iPhone: iOS spielt den Tick nur, wenn der Finger direkt einen nativen
   Schalter (<input type=checkbox switch>) trifft – per Skript geht es seit iOS 26.5 nicht mehr. Darum liegt in
   jedem Knopf mit Haptik ein unsichtbarer Schalter; der Tipp trifft ihn, der Klick läuft normal zum Knopf weiter. */
function haptic(){try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}
const HAPTIC_SKIP=new Set(['asubmit']);
function decorateHaptics(root){if(!/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)||!('ontouchend' in document))return;
  (root||document).querySelectorAll('[data-a]').forEach(el=>{const a=el.dataset.a;if(!HAPTIC.has(a)||HAPTIC_SKIP.has(a)||el.disabled||el.querySelector(':scope > .hsw'))return;
    const r=el.getBoundingClientRect();if(!r.width||r.width>120||r.height>64)return;
    if(getComputedStyle(el).position==='static')el.classList.add('hsw-host');
    const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.className='hsw';i.tabIndex=-1;i.setAttribute('aria-hidden','true');el.appendChild(i)})}
const HAPTIC=new Set(['asubmit','qdel','sitoggle','mood','taskdone','ptick','tog','inc','dec','lab','hstep','quick','hsave','tsave','tdone','nadd','ndel','hdelq','tdelq','harchq','undo']);
function readAuth(){if(!UI.auth)UI.auth={mode:'login',email:'',pw:'',err:'',info:'',busy:false};document.querySelectorAll('#view [data-af]').forEach(el=>{UI.auth[el.dataset.af]=el.value})}
function hasGuestData(){return (MODE==='guest'||UI.fromGuest)&&(S.todos.length>0||Object.keys(LOGS).length>0||S.quotes.length>0||!!S.plan.text||S.habits.some(h=>!['h-beten','h-lesen'].includes(h.id))||!!S.training)}
const shiftMonth=(M,dir)=>{const[y,m]=M.split('-').map(Number),d=new Date(y,m-1+dir,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};

function vPStats(){const P=PS(),t=today();if(!P.on||!prayerHabit())return '';
  const days=[];for(let k=0;k<30;k++){const d=addDays(t,-k),pd=prayerDay(d);if(pd&&pd.avg!=null)days.push({d,pd})}
  if(!days.length)return '';
  const avg=L=>L.length?Math.round(L.reduce((a,b)=>a+b,0)/L.length):null;
  const a7=avg(days.filter(x=>x.d>addDays(t,-7)).map(x=>x.pd.avg*100)),a30=avg(days.map(x=>x.pd.avg*100));
  const per=[0,1,2,3,4].map(i=>avg(days.map(x=>x.pd.items[i].sc).filter(v=>v!=null)));
  const ed=days.reduce((n,x)=>n+x.pd.items.filter(it=>it.ed).length,0);
  let bars='';for(let k=6;k>=0;k--){const d=addDays(t,-k),pd=prayerDay(d),v=pd&&pd.avg!=null?Math.round(pd.avg*100):null;
    bars+=`<div class="pbcol"><div class="pbt"><i style="height:${v??0}%"></i></div><small>${DN[wd(d)]}</small></div>`}

/* --- lange drücken auf ein Gebet: Uhrzeit ändern --- */
let lp=null,lpFired=false;
document.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('.chip[data-p]');if(!c||c.disabled)return;
  lp={x:e.clientX,y:e.clientY,t:setTimeout(()=>{lp=null;lpFired=true;swallowUntil=Date.now()+400;haptic();openPTime(c.dataset.d,+c.dataset.i)},550)}},{passive:true});
document.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>8){clearTimeout(lp.t);lp=null}},{passive:true});
// nach dem langen Druck den Klick beim Loslassen schlucken
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{if(lp){clearTimeout(lp.t);lp=null}if(lpFired){lpFired=false;swallowUntil=Date.now()+350}},{passive:true}));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.chip[data-p]'))e.preventDefault()});
// Restzeit live, und gesperrte Gebete freigeben, sobald ihre Zeit beginnt
setInterval(()=>{if(UI.page||UI.tab!=='heute'||document.hidden)return;
  document.querySelectorAll('.pstat[data-pd]').forEach(el=>{el.textContent=prayerStatus(el.dataset.pd)});
  const lk=[...document.querySelectorAll('.chip.plock[data-from]')].some(c=>nowMin(c.dataset.d)>=+c.dataset.from);if(lk)renderIdle()},20000);
