<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sabrly · Training (Prototyp)</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app, glass cards over a deep black field, floating glass tab bar, full-screen detail pages. Dark only, by choice. */
:root{
  --bg:#000000;
  --bgtop:#303338;
  --bg2:#0B0D0E;
  --glow-a:rgba(64,200,160,.15);
  --glow-b:rgba(90,140,255,.09);
  --glass:rgba(26,29,32,.62);
  --glass-2:rgba(42,46,50,.72);
  --glass-hi:rgba(255,255,255,.07);
  --solid-a:#1A1D20;
  --solid-b:#131518;
  --line:rgba(255,255,255,.085);
  --fg:#EEF2F1;
  --muted:#8A9391;
  --faint:#4A5250;
  --cell:#16191B;
  --accent:#46E0AE;
  --accent-ink:#04140E;
  --amber:#F2A93B;
  --orange:#D9622B;
  --blue:#4C8DFF;
  --green:#2FCB8E;
  --crit:#FF5F6D;
  --num:"Barlow Condensed","SF Pro Display",-apple-system,system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --spring:cubic-bezier(.2,.9,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
body.authmode .tabbar{display:none}
.auth{max-width:420px;margin:0 auto;padding-top:6vh;display:flex;flex-direction:column;gap:16px}
.auth-ic{width:88px;height:88px;border-radius:22px;align-self:center;box-shadow:0 12px 40px rgba(70,224,174,.18)}
.auth h1{text-align:center}
.auth .lead{text-align:center;color:var(--muted);font-size:15px;margin:-6px 0 4px;text-wrap:balance}
.auth .link{align-self:center}
.auth-sep{height:1px;background:var(--line);margin:6px 0}
.auth .hint{text-align:center}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.4;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(118px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
body.paged{padding-block:0 calc(40px + env(safe-area-inset-bottom,0px))}
body.paged .tabbar{display:none}
body.paged::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bgtop)}
/* soft grey-to-black fade behind everything */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--bgtop) 0%,#1F2124 25%,#0E0F11 50%,#000 74%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:30px;padding-top:14px}
.wrap.enter{animation:enter .28s var(--spring)}
@keyframes enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap.push{animation:push .3s var(--spring)}
@keyframes push{from{opacity:.3;transform:translateX(26px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px rgba(0,0,0,.35)}
.solid{background:linear-gradient(180deg,var(--solid-a),var(--solid-b));border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 26px rgba(0,0,0,.35)}
.card{border-radius:var(--r-lg);padding:16px}
.press{transition:transform .18s var(--spring)}
.press:active{transform:scale(.975)}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:23px;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sec>.sec-h h2,.sec>h2{font-size:29px;font-weight:750;letter-spacing:-.025em;line-height:1.1}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;background:var(--glass-2);font-size:13px;font-weight:600;color:var(--muted)}
.link{font-size:14px;font-weight:600;color:var(--fg);opacity:.85;display:inline-flex;align-items:center;gap:4px}
.hint{font-size:12.5px;color:var(--muted)}

/* Header + week strip */
.weekbar{border-radius:0 0 28px 28px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));margin-top:calc(-14px - env(safe-area-inset-top,0px));touch-action:pan-y}
.weekbar.glass{background:linear-gradient(180deg,#3A3E43 0%,#2F3337 100%);border:0;border-bottom:1px solid rgba(255,255,255,.1);box-shadow:inset 0 -1px 0 rgba(255,255,255,.03),0 12px 30px rgba(0,0,0,.45)}
.wb-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.mon{display:flex;flex-direction:column;align-items:flex-start;min-width:44px}
.mon b{font-size:14px;letter-spacing:.04em}
.mon span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-width:0;will-change:transform}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:14px;color:var(--muted);transition:background .2s}
.day .dn{font-size:12px}
.day .dd{font-family:var(--num);font-size:22px;font-weight:600;color:var(--fg);line-height:1}
.day .db{width:16px;height:3px;border-radius:2px;background:var(--faint);overflow:hidden}
.day .db i{display:block;height:100%;background:var(--accent)}
.day.fut .dd{color:var(--muted)}
.day.fut .db{background:transparent}
.day.today .dn{color:var(--fg);font-weight:700}
.day.today .dd::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--crit);margin:4px auto 0}
.day.sel{background:rgba(255,255,255,.13)}
.day.sel .dd{color:var(--fg)}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-size:19px;font-weight:700}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-8px}
.titlebar .tb-l{min-width:0;display:flex;flex-direction:column;gap:1px}
.titlebar .eyebrow{font-size:10.5px;letter-spacing:.11em;margin-bottom:0}
.titlebar .tb-row{display:flex;align-items:baseline;gap:7px;min-width:0;flex-wrap:wrap}
.titlebar h1{font-size:18px;letter-spacing:-.01em}
.titlebar .sub{font-size:13px;color:var(--muted)}
.titlebar .rbtn{width:32px;height:32px;font-size:17px}
.titlebar+.quote,.titlebar+.link+.quote{margin-top:-14px}
.wknav{display:flex;gap:8px;flex:none}
.rbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--glass-2);border:1px solid var(--line)}
.rbtn:disabled{opacity:.3}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;overflow-wrap:anywhere}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:400;background:var(--glass-2);border:1px solid var(--line);line-height:1}
.sec-h .right{display:flex;align-items:center;gap:12px}
/* Notes */
.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.nlist li{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);animation:enter .2s var(--spring)}
.nb{color:var(--accent);font-weight:700;flex:none;width:10px;line-height:1.45}
.nt{flex:1;min-width:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere;color:#DCE2E0}
.nx{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:13px;flex:none;background:rgba(255,255,255,.05)}
.nadd{display:flex;align-items:center;gap:10px;padding-top:6px}
.nadd .field{border-bottom-color:transparent}
.nplus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:19px;flex:none}
.emoinput{width:92px;flex:none;text-align:center;font-size:20px;min-height:42px;padding:6px 8px}
.emoprev{font-size:26px;line-height:1}
.futnote{border-radius:var(--r-md);padding:11px 14px;font-size:14px;color:var(--muted);border:1px dashed var(--line)}

.sec{display:flex;flex-direction:column;gap:12px}
.sec>.glass,.sec>.swipe{font-size:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

.banner{border-radius:var(--r-md);padding:12px 14px;border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);background:color-mix(in srgb,var(--amber) 10%,var(--glass))}
.banner b{color:var(--amber)}
.banner.crit{border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:color-mix(in srgb,var(--crit) 10%,var(--glass))}
.banner.crit b{color:var(--crit)}
.banner .bs{display:block;margin-top:4px;color:var(--fg);opacity:.92}
.banner.sit{font-size:13.5px;line-height:1.4;padding:10px 13px}
.banner.sit .bs{margin-top:3px}
.banner.neutral{border-color:var(--line);background:var(--glass)}
.banner.neutral b{color:var(--fg)}
.banner.good{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 11%,var(--glass))}
.banner.good b{color:var(--accent)}
/* Tagesspruch */
.quote{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;width:100%;overflow:hidden;border-radius:var(--r-lg);padding:18px 20px 19px;--qc:var(--accent);
  background:radial-gradient(130% 120% at 0% 0%,color-mix(in srgb,var(--qc) 17%,transparent),transparent 62%),linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid color-mix(in srgb,var(--qc) 30%,var(--line));box-shadow:inset 0 1px 0 var(--glass-hi),0 14px 34px rgba(0,0,0,.4);animation:enter .25s var(--spring);transition:transform .15s}
.quote:active{transform:scale(.985)}
.quote.vers{--qc:#E3BE76}
.qh-top{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
.qh-lab{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--qc)}
.qh-more{font-size:16px;color:var(--muted);line-height:1}
.quote .qt{position:relative;font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;font-size:24px;line-height:1.36;color:#F4F7F6;font-weight:500;overflow-wrap:anywhere;text-wrap:pretty}
.quote .qt.m{font-size:20px}
.quote .qt.l{font-size:17.5px;line-height:1.45}
.quote .qs{position:relative;font-size:14px;font-weight:600;color:var(--qc)}
.qh-mark{position:absolute;right:14px;bottom:-84px;font-family:Georgia,"Times New Roman",serif;font-size:150px;line-height:1;color:var(--qc);opacity:.1;pointer-events:none}
/* Sätze & Verse list */
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qlist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.qlist .qtag{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);margin-top:2px}
.qlist .qtag.v{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.qlist .qbody{flex:1;min-width:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.qlist .qbody small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13.5px;color:#C9D0CE}
.sug span{flex:1;min-width:0;overflow-wrap:anywhere}
.sug b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);color:var(--accent);font-size:17px;font-weight:500}
.switch{position:relative;width:52px;height:31px;border-radius:999px;background:rgba(255,255,255,.14);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s var(--spring)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(21px)}
.sitgrid{display:flex;flex-direction:column;gap:12px}
.sitgrid.off{opacity:.45}

/* Mood */
.mood{display:flex;justify-content:space-between;gap:6px;margin-top:2px}
.mood button{flex:1;max-width:46px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:21px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:transform .2s var(--spring),opacity .2s,background .2s}
.mood.set button{opacity:.42}
.mood button.on{opacity:1;background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent);transform:scale(1.08);animation:pop .3s var(--spring)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.14)}100%{transform:scale(1.08)}}

/* Habit rows */
.hrow{border-radius:var(--r-lg);padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:12px}
.hrow .top{display:flex;align-items:center;gap:12px}
.emo{font-size:18px;width:26px;text-align:center;flex:none}
.hname{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.hname small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:1px}
.hrow.done .hname{color:var(--muted)}
.hrow.locked{opacity:.62}
/* Heute: Namen von Habits und Aufgaben deutlicher */
.hl .hname{font-size:17px;font-weight:700;letter-spacing:-.01em;color:#F4F7F6}
.hl .hname small{font-size:12px;font-weight:500;letter-spacing:0;margin-top:2px}
.hl .emo{font-size:20px;width:28px}
.hl .hrow.done .hname{color:var(--muted)}
.hl .todo .tt b{font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:#F4F7F6}
.hl .todo .tt span{font-size:12px}
.hl .todo.done .tt b{color:var(--muted)}
.circle{width:34px;height:34px;border-radius:50%;border:2px solid #5D6563;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .2s var(--spring)}
.circle.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop2 .32s var(--spring)}
.circle:disabled,.chip:disabled,.cbtn:disabled,.check:disabled{opacity:.45}
@keyframes pop2{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.circle svg{width:20px;height:20px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.chip{border-radius:11px;padding:8px 4px;font-size:12.5px;font-weight:600;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);transition:background .2s,border-color .2s,transform .15s}
.chip:not(:disabled):active{transform:scale(.94)}
.chip.on{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:color-mix(in srgb,var(--accent) 70%,transparent);color:var(--fg)}
.hsw-host{position:relative}
.hsw{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;z-index:6;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip{position:relative;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chip .pb{position:absolute;left:0;bottom:0;height:3px;background:#E3BE76;border-radius:0 3px 3px 0}
.chip .pe{position:absolute;top:1px;right:4px;font-size:9px;font-style:normal;color:#E3BE76}
.chip.plock{opacity:.38}
.chip.pmiss{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));color:color-mix(in srgb,var(--crit) 70%,var(--muted))}
.pstat{font-size:12.5px;font-weight:600;color:#E3BE76;margin-top:-2px}
.link.pyest{align-self:flex-start;font-size:13px;margin-top:-4px}
.ring.hasg b{font-size:13px}
.ptimes{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px}
.ptimes span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;background:rgba(255,255,255,.04)}
.ptimes small{font-size:10.5px;color:var(--muted);font-weight:600}
.ptimes b{font-size:14px}
.pval{font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.plist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.pcity{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:left}
.pcity b{font-size:15px}.pcity span{font-size:12px;color:var(--muted)}
.pprev{font-size:15px}.pprev b{color:#E3BE76;font-size:20px;margin-left:6px}
.pbars{display:flex;gap:8px;align-items:flex-end}
.pbcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.pbt{width:100%;max-width:26px;height:64px;border-radius:7px;background:rgba(227,190,118,.12);display:flex;align-items:flex-end;overflow:hidden}
.pbt i{display:block;width:100%;background:#E3BE76;border-radius:7px}
.pbcol small{font-size:11px;color:var(--muted)}
.fold{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.fold .chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin-left:2px;transition:transform .2s;flex:none}
.fold[aria-expanded="true"] .chev{transform:rotate(45deg)}
.counter{display:flex;align-items:center;gap:8px}
.cbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;transition:transform .15s}
.cbtn:not(:disabled):active{transform:scale(.9)}
.cbtn.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--faint);transition:background .2s}
.dots i.on{background:var(--accent)}

/* Task / journal */
.taskline{display:flex;align-items:center;gap:12px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #5D6563;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop2 .3s var(--spring)}
.check svg{width:16px;height:16px}
.field{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 0;font-size:16px;color:#DCE2E0;outline:none;border-radius:0}
.field:focus{border-bottom-color:var(--accent)}
.field::placeholder{color:var(--faint);font-size:15px}
.taskline.done .field{color:var(--muted);text-decoration:line-through}
.saved{font-size:12px;color:var(--accent);opacity:0;transition:opacity .3s;min-height:16px}
.saved.show{opacity:1}

/* Tagesablauf */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}

 pull:{n:'Pull',s:'Pull',k:'k',ex:['pullups','tbar','stepups','rotation','facepull','curls'],min:70},
 c:{n:'Tag C',s:'C',sub:'Oberkörper',k:'k',ex:['emom','bpresse95','kelso','kcurls','katana2','facepull3'],min:60},
 lauf:{n:'Lauf locker',s:'Lauf',k:'l',run:'easy',min:60,desc:'60 min · Puls unter 150 · Pace ca. 7:30–7:45',d2:'60 min · Puls unter 150'},
 qual:{n:'Qualitätslauf',s:'3×8',k:'q',run:'iv',min:45,desc:'3 × 8 min, dazwischen 2 min traben',d2:'3 × 8 min · 2 min traben'},
 rest:{n:'Ruhetag',k:'r'}};
const DN=['Mo','Di','Mi','Do','Fr','Sa','So'];
const IVP={'4x4':{n:4,len:4,u:'min',p:'3 min traben',v:[['5:10',168],['5:08',171],['5:06',173],['5:05',175]]},
 '3x8':{n:3,len:8,u:'min',p:'2 min traben',v:[['5:36',167],['5:35',169],['5:34',171]]},
 '6x400':{n:6,len:400,u:'m',p:'200 m traben',v:[['1:52',165],['1:51',168],['1:50',170],['1:50',171],['1:49',173],['1:48',174]]},
 '8x200':{n:8,len:200,u:'m',p:'200 m gehen',v:[['0:53',158],['0:52',162],['0:52',164],['0:51',166],['0:51',167],['0:50',169],['0:50',170],['0:49',171]]}};
const ivName=P=>`${P.n} × ${P.len} ${P.u}`;
const toSec=t=>{const p=String(t).split(':').map(Number);return p.length===2?p[0]*60+p[1]:p.length===3?p[0]*3600+p[1]*60+p[2]:NaN};
const kw=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
/* ---------- Zustand ---------- */
const now=new Date(),wd=(now.getDay()+6)%7,mon=new Date(now);mon.setDate(now.getDate()-wd);
const dateOf=(i,w=0)=>{const d=new Date(mon);d.setDate(mon.getDate()+i+7*w);return d};
const UI={tab:'training',page:null,stack:[],bar:5,w:null,timer:null,rest:null,emom:null,sel:wd};
let WEEK=[['push'],['lauf'],['pull'],[],['qual'],['c'],['lauf']];   // diese Woche (Beispiel)
const DONE=new Set();for(let i=0;i<wd;i++)DONE.add(i);              // vergangene Tage erledigt
let NEXT={days:[[],[],[],[],[],[],[]],shift:['F','F','S','S','S','',''] };
const RUNS=[{d:-2,t:'easy',km:8.0,dur:3690,hr:146,max:158},{d:-4,t:'iv',n:'Intervalle 3 × 8 min',km:7.1,dur:2760,hr:158,max:176},{d:-6,t:'easy',km:7.8,dur:3640,hr:147,max:157},{d:-9,t:'easy',km:7.6,dur:3620,hr:148,max:159}];

/* ---------- Rendering ---------- */
function tabs(){const L=UI.bar===6?['heute','habits','aufgaben','training','statistik','mehr']:['heute','habits','training','aufgaben','mehr'];
  const nav=$('#tabbar');nav.className='tabbar glass'+(UI.bar===6?' six':'');
  nav.innerHTML=L.map(t=>`<button class="tab${UI.tab===t?' on':''}" data-a="tab" data-t="${t}">${ICON[t]}${TABNAME[t]}</button>`).join('')}
function render(anim){const v=$('#view');
  v.innerHTML=UI.page?PAGES[UI.page.t]():({training:vTraining,heute:vHeute,habits:vHabits,statistik:vStat,aufgaben:vPh,mehr:vPh}[UI.tab])();
  if(anim){v.classList.remove('enter','push');void v.offsetWidth;v.classList.add(anim)}
  document.body.classList.toggle('paged',!!UI.page);tabs();restbar()}
const go=p=>{if(UI.page)UI.stack.push(UI.page);UI.page=p;render('push');window.scrollTo(0,0)};
const back=()=>{UI.page=UI.stack.pop()||null;render('enter');window.scrollTo(0,0)};
const home=()=>{UI.stack=[];back()};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
function sheet(h){$('#sheet').innerHTML=h?`<div class="ovl" data-a="close"><div class="sheet"><div class="grab"></div>${h}</div></div>`:''}

function weekStrip(){return `<div class="wkt">${DN.map((n,i)=>{const d=dateOf(i);return `<button type="button" class="d${i===wd?' t':''}${i===UI.sel?' sel':''}" data-a="day" data-i="${i}"><small>${n}</small><b>${d.getDate()}</b>${
  (WEEK[i].length?WEEK[i]:['rest']).map(k=>`<span class="tg ${W[k].k}${DONE.has(i)&&k!=='rest'?' ok':''}">${k==='rest'?'–':W[k].s}</span>`).join('')}</button>`}).join('')}</div>`}
function muscleSets(){const M={Brust:0,Rücken:0,Schultern:0,Arme:0,Beine:0,Core:0};
  WEEK.forEach(ks=>ks.forEach(k=>{const w=W[k];if(!w.ex)return;w.ex.forEach(id=>{const e=EX[id],n=e.t==='emom'?5:e.sets.length;for(const [m,f] of Object.entries(e.m))M[m]+=n*f})}));return M}
function vTraining(){const sd=UI.sel,today=WEEK[sd][0]||'rest',w=W[today],lbl=sd===wd?'Heute':sd<wd?DN[sd]+' '+dateOf(sd).getDate()+'. · vorbei':DN[sd]+' '+dateOf(sd).getDate()+'.';
  let h=`<div class="titlebar"><div class="tb-l"><div class="tb-row"><h1>Training</h1><span class="sub">Woche ${DN[0]} ${dateOf(0).getDate()}. – ${DN[6]} ${dateOf(6).getDate()}.</span></div></div></div>`;
  h+=`<section class="sec">${weekStrip()}</section>`;
  if(w.ex)h+=`<div class="hero"><span class="label" style="color:var(--accent)">${lbl}</span><h3>${w.n}${w.sub?` <span style="font-size:17px;color:var(--muted)">· ${w.sub}</span>`:''}</h3>
    <span class="meta">${w.ex.length} Übungen · ca. ${w.min} min</span><div class="exl">${w.ex.map(id=>`<span>${esc(EX[id].n)}</span>`).join('')}</div>
    <button type="button" class="btn pri" data-a="start" data-w="${today}">${DONE.has(sd)?'Erledigt ✓ · nochmal ansehen':sd===wd?'Training starten':'Jetzt starten'}</button></div>`;
  else if(w.run)h+=`<div class="hero run"><span class="label" style="color:#8DB4FF">${lbl}</span><h3>${w.n}</h3><span class="meta">${w.desc}</span><button type="button" class="btn pri" style="background:#4C8DFF;border-color:#4C8DFF;color:#fff" data-a="run" data-k="${w.run}">Lauf eintragen</button></div>`;
  else h+=`<div class="hero"><span class="label">${lbl}</span><h3>Ruhetag</h3><span class="meta">Erholung gehört zum Training.</span></div>`;
  const M=muscleSets(),T={Brust:[10,16],Rücken:[10,18],Schultern:[8,14],Arme:[8,14],Beine:[8,14],Core:[6,12]};
  h+=`<section class="sec"><div class="sec-h"><h2>Diese Woche</h2><span class="pill num">Kraft 3× · Laufen 3×</span></div><div class="card glass stack" style="gap:14px">
    <span class="label">Sätze pro Muskelgruppe</span><div class="mbars">${Object.entries(M).map(([m,v])=>{const [a,b]=T[m],mx=22;
      return `<div class="mbar${v<a?' lo':''}"><span>${m}</span><div class="tr"><u style="left:${a/mx*100}%;width:${(b-a)/mx*100}%"></u><i style="width:${Math.min(100,v/mx*100)}%"></i></div><b>${Math.round(v)}</b></div>`}).join('')}</div>
    <span class="hint">Gestrichelt: sinnvoller Bereich für Muskelaufbau. Beine liegen knapp darunter – Step-ups und Swings sind deine einzigen Beinübungen.</span></div></section>`;
  h+=`<div class="gridbtns"><button type="button" class="btn" data-a="plan">📅 Nächste Woche<small>Tage zuweisen</small></button><button type="button" class="btn" data-a="runs">🏃 Laufen<small>Puls & Pace</small></button>
    <button type="button" class="btn" data-a="run" data-k="easy">＋ Lauf eintragen<small>aus Garmin übernehmen</small></button><button type="button" class="btn" data-a="exlist">🏋️ Übungen<small>Verlauf & Bestwerte</small></button></div>`;
  return h}
/* --- andere Tabs, nur angedeutet --- */
function tday(){const k=WEEK[wd][0];if(!k)return '';const w=W[k],done=DONE.has(wd);
  return `<div class="tday glass${w.run?' run':''}${done?' ok':''}"><span class="ic">${w.run?'🏃':ICON.training}</span><span class="tx"><small>Training heute</small><b>${w.n}${w.sub?' · '+w.sub:''}</b><span>${w.ex?w.ex.length+' Übungen · ca. '+w.min+' min':w.d2}</span></span>
    ${done?'<span class="go">✓</span>':w.ex?`<button type="button" class="go" data-a="start" data-w="${k}">Starten</button>`:`<button type="button" class="go" data-a="run" data-k="${w.run}">Eintragen</button>`}</div>`}
function vHeute(){const ph=(t,x)=>`<section class="sec phs"><div class="sec-h"><h2>${t}</h2></div><div class="card glass ph2">${x}</div></section>`;
  return `<div class="titlebar"><div class="tb-l"><div class="tb-row"><h1>Heute</h1></div></div></div>
  <div class="card glass ph2 phs">Vers des Tages · Situations-Satz</div>
  ${ph('Habits','Deine Habits wie bisher')}${ph('Aufgaben','Deine Aufgaben wie bisher')}
  ${tday()}
  ${ph('Rückblick','Wie war dein Tag?')}${ph('Notizen','Notizen · Tagesablauf')}
  <span class="hint">Im Prototyp angedeutet – neu ist nur die Trainingszeile zwischen Aufgaben und Rückblick. Am Ruhetag erscheint sie nicht.</span>`}
function vHabits(){if(UI.bar===6)return vPh();UI.hseg=UI.hseg||'h';return `<div class="titlebar"><div class="tb-l"><div class="tb-row"><h1>Habits</h1></div></div></div>
  <div class="seg"><button class="${UI.hseg==='h'?'on':''}" data-a="hseg" data-v="h">Habits</button><button class="${UI.hseg==='s'?'on':''}" data-a="hseg" data-v="s">Statistik</button></div>
  <div class="card glass ph2">${UI.hseg==='h'?'Deine Habits wie bisher.':'Die Statistik wie bisher – nur eben hier oben umschaltbar statt als eigener Tab.'}</div>
  <span class="hint">Variante mit 5 Tabs: Statistik wandert hier in einen Umschalter.</span>`}
function vStat(){return `<div class="titlebar"><div class="tb-l"><div class="tb-row"><h1>Statistik</h1></div></div></div><div class="card glass ph2">Statistik wie bisher (eigener Tab in der Variante mit 6 Tabs).</div>`}
function vPh(){return `<div class="titlebar"><div class="tb-l"><div class="tb-row"><h1>${TABNAME[UI.tab]}</h1></div></div></div><div class="card glass ph2">Dieser Bereich bleibt wie in Sabrly – im Prototyp nur angedeutet. Probier den Tab <b>Training</b>.</div>`}

/* --- Trainingsmodus --- */
function startW(k){const w=W[k];UI.w={k,start:Date.now(),ex:w.ex.map(id=>({id,orig:id,name:EX[id].n,swapped:false,rest:EX[id].rest||60,sets:EX[id].t==='emom'?[]:EX[id].sets.map(([a,b])=>({kg:a,r:b,done:false}))}))};go({t:'work'})}
function pWork(){const W0=UI.w,w=W[W0.k],el=Math.floor((Date.now()-W0.start)/1000);
  let h=`<div class="ptopbar"><button type="button" class="txtbtn sec2" data-a="wcancel">Abbrechen</button><h2>${w.n} · <span class="num wtime" id="wtime">${mmss(el)}</span></h2><button type="button" class="r txtbtn pri" data-a="wfinish">Fertig</button></div>`;
  const cur=W0.ex.findIndex(x=>x.sets.length?x.sets.some(s=>!s.done):!(UI.emom&&UI.emom.done));
  W0.ex.forEach((x,xi)=>{const e=EX[x.id];
    h+=`<div class="exc glass${xi===cur?' cur':''}"><div class="exh"><button type="button" class="nm" data-a="exd" data-x="${x.id}">${esc(x.name)}</button><button type="button" class="ib" data-a="info" data-x="${xi}" aria-label="Hinweise">i</button><button type="button" class="ib" data-a="swap" data-x="${xi}" aria-label="Alternative">⇄</button></div>`;
    h+=x.swapped?`<span class="last">Neu für dich – noch keine Werte</span><span class="sug">Starte mit einem Gewicht für ${e.lo}–${e.hi} saubere Wdh.</span>`:`<span class="last">Letztes Mal: ${e.last}</span><span class="sug">→ ${e.sug}</span>`;
    if(e.plat&&!x.swapped)h+=`<div class="plat">⚠︎ ${e.plat}</div>`;
    if(e.t==='emom')h+=emomCard();
    else{h+=`<div class="sets">${x.sets.map((s,si)=>`<div class="srow${s.done?' done':''}"><span class="no">${si+1}</span>
        <label>${e.t==='bw'?'<span>+</span>':''}<input inputmode="decimal" value="${kg(s.kg)}" data-in="kg" data-x="${xi}" data-s="${si}"><span>kg${e.t==='side'&&x.id==='stepups'?' (2×)':''}</span></label>
        <label><input inputmode="numeric" value="${s.r}" data-in="r" data-x="${xi}" data-s="${si}"><span>${e.t==='time'?'s / Seite':e.t==='side'?'/ Seite':'Wdh.'}</span></label>
        <button type="button" class="ck" data-a="set" data-x="${xi}" data-s="${si}" aria-label="Satz erledigt">✓</button></div>`).join('')}</div>
        <div class="exf"><button type="button" class="addset" data-a="addset" data-x="${xi}">+ Satz</button><span class="rctl">Pause<button type="button" data-a="rdec" data-x="${xi}" aria-label="10 Sekunden kürzer">−</button><b>${mmss(x.rest)}</b><button type="button" data-a="rinc" data-x="${xi}" aria-label="10 Sekunden länger">+</button></span></div>`}
    h+=`</div>`});
  h+=`<button type="button" class="btn pri" data-a="wfinish">Training beenden</button>`;return h}
function emomCard(){const E=UI.emom||{r:0,left:60,run:false,done:false},e=EX.emom,ex=E.r%2===0?'Chin-ups':'Dips';
  return `<div class="emom"><span class="rnd">${E.done?'Fertig':`Runde ${Math.min(E.r+1,e.rounds)} von ${e.rounds}`}</span><span class="big" id="emomt">${E.done?'✓':mmss(E.left)}</span>
    <span class="cur">${E.done?'10 × 6 geschafft':`${ex} · ${e.reps} Wdh.`}</span><div class="dots">${Array.from({length:e.rounds},(_,i)=>`<i class="${i<E.r?'on':''}"></i>`).join('')}</div>
    ${E.done?'':`<button type="button" class="btn${E.run?'':' pri'}" style="margin-top:6px;min-width:160px" data-a="emom">${E.run?'Pause':E.r?'Weiter':'EMOM starten'}</button>`}</div>`}
function restbar(){const R=UI.rest,b=$('#restbar');if(!R||!UI.page||UI.page.t!=='work'){b.innerHTML='';return}
  const left=Math.max(0,Math.ceil((R.end-Date.now())/1000));
  b.innerHTML=`<div class="rest"><span class="rt">${mmss(left)}</span><div class="rb"><i style="width:${left/R.total*100}%"></i></div><button type="button" data-a="restm">−10 s</button><button type="button" data-a="restp">+10 s</button><button type="button" data-a="restskip">Weiter</button></div>`;
  if(left<=0){UI.rest=null;b.innerHTML='';toast('Pause vorbei – nächster Satz')}}
setInterval(()=>{if(UI.page&&UI.page.t==='work'){const t=$('#wtime');if(t)t.textContent=mmss(Math.floor((Date.now()-UI.w.start)/1000));restbar();
  const E=UI.emom;if(E&&E.run){E.left--;if(E.left<=0){E.r++;E.left=60;if(E.r>=EX.emom.rounds){E.run=false;E.done=true}render()}else{const el=$('#emomt');if(el)el.textContent=mmss(E.left)}}}},1000);
function next(e,x){const S=x.sets.filter(s=>s.done);if(!S.length)return null;const top=Math.max(...S.map(s=>s.kg));
  if(e.t==='time')return S.every(s=>s.r>=e.hi)?`${kg(top+e.inc)} kg`:`${kg(top)} kg · ${Math.min(...S.map(s=>s.r))+5} s`;
  if(S.every(s=>s.r>=e.hi))return `${kg(top+e.inc)} kg${e.t==='bw'?' Zusatz':''}`;
  if(S.some(s=>s.r<e.lo))return `${kg(top)} kg halten`;
  return `${kg(top)} kg · +1 Wdh.`}
function pDone(){const W0=UI.w,w=W[W0.k],sets=W0.ex.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0)+(UI.emom&&UI.emom.r?UI.emom.r:0);
  const vol=W0.ex.reduce((n,x)=>n+x.sets.filter(s=>s.done).reduce((a,s)=>a+s.kg*s.r,0),0),real=Math.round((Date.now()-W0.start)/60000),min=real>=15?real:Math.max(1,Math.round(sets*2.9));
  const N=W0.ex.map(x=>[x.name,EX[x.id].t==='emom'?null:next(EX[x.id],x)]).filter(z=>z[1]);
  return `<div class="ptopbar"><span></span><h2>${w.n} geschafft</h2><button type="button" class="r txtbtn pri" data-a="wclose">Fertig</button></div>
   <div class="summ"><span><b>${min}</b><small>Minuten</small></span><span><b>${sets}</b><small>Sätze</small></span><span><b>${kg(Math.round(vol/100)/10)}</b><small>Tonnen</small></span></div>
   ${W0.ex.some(x=>x.id==='tbar'&&x.sets.every(s=>s.done&&s.r>=10))?`<div class="plat" style="color:#E3BE76;border-color:rgba(227,190,118,.3);background:rgba(227,190,118,.08)">🏆 Neuer Bestwert: T-Bar Row 62,5 kg × 10</div>`:''}
   <div class="card glass stack" style="gap:10px"><span class="label">Wie schwer war's?</span><div class="seg">${['Leicht','Okay','Hart'].map((t,i)=>`<button class="${UI.feel===i?'on':''}" data-a="feel" data-v="${i}">${t}</button>`).join('')}</div>
   <span class="hint">„Hart“ hält beim nächsten Mal das Gewicht, „Leicht“ darf schneller steigern.</span></div>
   <div class="card glass stack" style="gap:10px"><span class="label">Vorschlag fürs nächste Mal</span><div class="nxt">${N.length?N.map(([n,v])=>`<div><span>${esc(n)}</span><b>${v}</b></div>`).join(''):'<span class="hint">Hake Sätze ab, dann erscheinen hier die Vorschläge.</span>'}</div></div>
   <span class="hint">Dein Habit „Training“ wäre jetzt automatisch abgehakt.</span>`}
/* --- Übung im Detail --- */
function pEx(){const id=UI.page.x,e=EX[id];const hist=[...Array(8)].map((_,i)=>e.sets?Math.max(...e.sets.map(s=>s[0]))-e.inc*Math.floor((7-i)/2):0);
  const mx=Math.max(...hist),mn=Math.min(...hist)-e.inc,pts=hist.map((v,i)=>[10+i*(300/7),110-(v-mn)/(mx-mn||1)*90]);
  return `<div class="ptopbar"><button type="button" class="txtbtn sec2" data-a="back">Zurück</button><h2>${esc(e.n)}</h2><button type="button" class="r ib" data-a="infoid" data-x="${id}">i</button></div>
   ${e.sets?`<div class="card glass stack" style="gap:8px"><span class="label">Bestwert</span><span class="big1">${kg(Math.max(...e.sets.map(s=>s[0])))} kg × ${e.sets[0][1]}</span><span class="hint">${e.plat?'Seit 5 Einheiten kein Fortschritt – im Training steht ein Tipp dazu.':'Zuletzt gesteigert vor 2 Wochen.'}</span></div>
   <div class="card glass stack chart" style="gap:8px"><span class="label">Schwerster Satz · letzte 8 Einheiten</span><svg viewBox="0 0 320 124"><polyline fill="none" stroke="#46E0AE" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#46E0AE"/>`).join('')}</svg>
   <span class="hint">${kg(hist[0])} → ${kg(hist[7])} kg in 8 Einheiten</span></div>`:''}
   <div class="card glass stack" style="gap:6px"><span class="label">Letzte Einheiten</span>${[1,2,3,4].map(i=>`<div class="row between"><span>vor ${i} Wo.</span><span class="num">${e.sets?kg(hist[8-i])+' kg × '+e.sets[0][1]:e.last}</span></div>`).join('')}</div>`}
function pExList(){return `<div class="ptopbar"><button type="button" class="txtbtn sec2" data-a="back">Zurück</button><h2>Übungen</h2><span></span></div>
  ${['push','pull','c'].map(k=>`<section class="sec"><div class="sec-h"><h2 style="font-size:22px">${W[k].n}${W[k].sub?' · '+W[k].sub:''}</h2><button type="button" class="link" data-a="noop">Bearbeiten</button></div><div class="card glass stack" style="gap:2px">${W[k].ex.map(id=>`<button type="button" class="opt" style="background:none;border:0;padding:10px 2px" data-a="exd" data-x="${id}"><span style="flex:1"><b>${esc(EX[id].n)}</b><small>${EX[id].last}</small></span><span style="color:var(--muted)">›</span></button>`).join('')}</div></section>`).join('')}`}
/* --- Wochenplanung --- */
function pPlan(){const harder=k=>['push','pull','c','qual'].includes(k);
  return `<div class="ptopbar"><button type="button" class="txtbtn sec2" data-a="back">Abbrechen</button><h2>Nächste Woche</h2><button type="button" class="r txtbtn pri" data-a="plansave">Sichern</button></div>
  <div class="btns"><button type="button" class="btn" data-a="plancopy">↻ Wie diese Woche</button><button type="button" class="btn" data-a="planclear">Leeren</button></div>
  ${DN.map((n,i)=>{const d=dateOf(i,1),L=NEXT.days[i],sh=NEXT.shift[i],two=L.filter(harder).length>1;
    return `<div class="prow glass"><div class="ph"><b>${n} ${d.getDate()}.</b><button type="button" class="shift ${sh}" data-a="shift" data-i="${i}">${sh==='F'?'Früh':sh==='S'?'Spät':sh==='N'?'Nacht':'frei'}</button></div>
      <div class="pchips">${L.map((k,j)=>`<button type="button" class="pchip ${W[k].k}" data-a="pdel" data-i="${i}" data-j="${j}">${W[k].n}<i>✕</i></button>`).join('')}<button type="button" class="padd" data-a="padd" data-i="${i}">+ Training</button></div>
      ${two?'<span class="warn">⚠︎ Zwei harte Einheiten an einem Tag</span>':''}${i>0&&L.includes('qual')&&NEXT.days[i-1].some(k=>['pull'].includes(k))?'<span class="warn">⚠︎ Qualitätslauf direkt nach Pull mit Step-ups – Beine evtl. noch müde</span>':''}</div>`}).join('')}
  <span class="hint">Schicht pro Tag antippen (frei → Früh → Spät → Nacht). Hilft beim Planen, z. B. Qualitätslauf an freien Tagen.</span>`}
/* --- Laufen --- */
function pRun(){const R=UI.page.r;const sec=(R.h*3600+R.m*60+R.s),pace=R.km>0?sec/R.km:0,iv=R.k==='iv';
  return `<div class="ptopbar"><button type="button" class="txtbtn sec2" data-a="back">Abbrechen</button><h2>Lauf eintragen</h2><button type="button" class="r txtbtn pri" data-a="runsave">Sichern</button></div>
  <div class="seg">${[['easy','Locker / Lang'],['iv','Intervalle']].map(([k,t])=>`<button class="${R.k===k?'on':''}" data-a="rtype" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="card glass stack" style="gap:12px"><div class="fgrid">
    <div class="fgroup"><label class="label">Dauer${iv?' gesamt':''}</label><input class="tinput" data-rf="dur" value="${R.h}:${pad(R.m)}:${pad(R.s)}" inputmode="numeric"></div>
    <div class="fgroup"><label class="label">Distanz${iv?' gesamt':''} (km)</label><input class="tinput" data-rf="km" value="${kg(R.km)}" inputmode="decimal"></div>
    <div class="fgroup"><label class="label">Ø-Puls</label><input class="tinput" data-rf="hr" value="${R.hr}" inputmode="numeric"></div>
    <div class="fgroup"><label class="label">Max-Puls</label><input class="tinput" data-rf="max" value="${R.max}" inputmode="numeric"></div></div>
    <div class="pace"><b id="pace">${pace?mmss(pace):'–'}</b><span class="hint">min/km${iv?' inkl. Ein-/Auslaufen':''}</span><span style="flex:1"></span>${iv?'':`<span id="hrok" class="pill" style="color:${R.hr<150?'var(--accent)':'var(--amber)'}">${R.hr<150?'Puls unter 150 ✓':'Puls über 150'}</span>`}</div></div>
  ${iv?ivCard(R):''}
  <span class="hint">${iv?'':'Lockere und lange Läufe landen zusammen in „Pace bei Puls unter 150“. '}Werte aus Garmin Connect bzw. der Trainings-App der Apple Watch übernehmen. Später möglich: automatisch über einen Kurzbefehl aus Apple Health.</span>`}
function ivCard(R){const P=R.ivp==='own'?R.own:IVP[R.ivp],dist=P.u==='m';
  return `<div class="card glass stack" style="gap:12px"><span class="label">Was bist du gelaufen?</span>
  <div class="ivp">${Object.keys(IVP).map(k=>`<button class="${R.ivp===k?'on':''}" data-a="ivp" data-v="${k}">${ivName(IVP[k])}</button>`).join('')}<button class="${R.ivp==='own'?'on':''}" data-a="ivp" data-v="own">Eigene</button></div>
  ${R.ivp==='own'?`<div class="ivcus"><label class="ivin"><input data-own="n" value="${P.n}" inputmode="numeric"><span>×</span></label><label class="ivin"><input data-own="len" value="${P.len}" inputmode="numeric"><span>${P.u}</span></label>
    <div class="seg"><button class="${P.u==='min'?'on':''}" data-a="ownu" data-v="min">min</button><button class="${P.u==='m'?'on':''}" data-a="ownu" data-v="m">m</button></div></div>
    <label class="ivin"><input data-own="p" value="${esc(P.p)}"><span>Pause dazwischen</span></label>`:`<span class="hint">Dazwischen: ${P.p}</span>`}
  <div class="ivrow ivhd"><span>Intervall</span><span>${dist?'Zeit':'Pace'}</span><span>Ø-Puls</span></div>
  ${R.iv.map((v,i)=>{const ps=dist&&v[0]?toSec(v[0])/(P.len/1000):0;
    return `<div class="ivrow"><span class="lb"><b>${i+1}. · ${P.len} ${P.u}</b>${dist?`<small>${ps?'= '+mmss(ps)+' /km':''}</small>`:''}</span>
    <label class="ivin"><input data-iv="${i}" data-f="0" value="${v[0]}" placeholder="${dist?'1:50':'5:30'}" inputmode="numeric"><span>${dist?'min':'/km'}</span></label>
    <label class="ivin"><input data-iv="${i}" data-f="1" value="${v[1]}" placeholder="165" inputmode="numeric"><span>bpm</span></label></div>`}).join('')}
  <span class="hint">Aus den Runden (Laps) deiner Uhr: bei Zeit-Intervallen die Pace, bei Strecken-Intervallen die Zeit – die Pace rechnet Sabrly dann aus. Ø-Puls = Durchschnittspuls in diesem Intervall. Ein Tempolauf ist einfach „Eigene“ mit 1 × 20 min.</span></div>`}
function pRuns(){const P=[485,482,479,474,470,466,461,456],mx=490,mn=450,pts=P.map((v,i)=>[14+i*(292/7),12+(v-mn)/(mx-mn)*96]);
  const cur=RUNS.filter(r=>r.d>=-wd).reduce((a,r)=>a+r.km,0),KM=[22,16,24,21,25,23,23,Math.round(cur*10)/10];
  return `<div class="ptopbar"><button type="button" class="txtbtn sec2" data-a="back">Zurück</button><h2>Laufen</h2><button type="button" class="r txtbtn pri" data-a="run" data-k="easy">＋</button></div>
  <div class="card glass stack chart" style="gap:8px"><span class="label">Pace bei Puls unter 150 · 8 Wochen</span><span class="big1">7:36 <span class="hint" style="font-family:var(--ui)">min/km</span></span>
   <svg viewBox="0 0 320 120"><polyline fill="none" stroke="#8DB4FF" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#8DB4FF"/>`).join('')}</svg>
   <span class="hint" style="color:var(--accent)">Bei gleichem Puls 29 s/km schneller als vor 8 Wochen – deine Grundlagenausdauer wächst.</span></div>
  <div class="card glass stack" style="gap:8px"><span class="label">Kilometer pro Woche</span><div class="pbars kmw">${KM.map((v,i)=>{const d=dateOf(0,i-7);return `<div class="pbcol"><b class="kmv">${v?kg(v):'–'}</b><div class="pbt" style="background:rgba(76,141,255,.12)"><i style="height:${v/30*100}%;background:#4C8DFF${i===7?';opacity:.6':''}"></i></div><small>KW ${kw(d)}</small></div>`}).join('')}</div><span class="hint">Letzte Säule = diese Woche (läuft noch).</span></div>
  <div class="card glass stack" style="gap:6px"><span class="label">Intervalle 3 × 8 min</span><span>Ø-Puls im letzten Intervall bei ~5:35/km</span><span class="num" style="font-size:22px">176 → 171 <span class="hint" style="font-family:var(--ui)">in 4 Wochen</span></span></div>
  <section class="sec"><div class="sec-h"><h2 style="font-size:22px">Letzte Läufe</h2></div>${RUNS.map(r=>{const d=new Date(now);d.setDate(now.getDate()+r.d);
    return `<div class="runl glass"><span class="ic" style="background:${r.t==='iv'?'rgba(242,169,59,.16)':'rgba(76,141,255,.16)'}">${r.t==='iv'?'⚡':'🏃'}</span><span class="tx"><b>${r.n||(r.t==='iv'?'Intervalle':'Lauf locker')}</b><small>${DN[(d.getDay()+6)%7]} ${d.getDate()}. · ${kg(r.km)} km · ${mmss(r.dur/r.km)} /km</small></span><span class="v">${r.hr}<small>Ø-Puls</small></span></div>`}).join('')}</section>`}
const PAGES={work:pWork,done:pDone,ex:pEx,exlist:pExList,plan:pPlan,run:pRun,runs:pRuns};

/* ---------- Aktionen ---------- */
const ACT={
 day:el=>{UI.sel=+el.dataset.i;render()},
 tab:el=>{UI.tab=el.dataset.t;UI.sel=wd;UI.page=null;UI.stack=[];render('enter');window.scrollTo(0,0)},
 back:()=>back(),close:(el,e)=>{if(e.target===el)sheet('')},xclose:()=>sheet(''),noop:()=>toast('Im Prototyp nicht aktiv'),
 proto:()=>sheet(`<h3>Prototyp</h3><span class="hint">Klick-Prototyp mit deinem Split und Beispieldaten. Nichts wird gespeichert, deine echten Sabrly-Daten bleiben unberührt.</span>
   <span class="label">Leiste unten</span><div class="seg"><button class="${UI.bar===6?'on':''}" data-a="bar" data-v="6">6 Tabs</button><button class="${UI.bar===5?'on':''}" data-a="bar" data-v="5">5 Tabs (Statistik in Habits)</button></div>
   <button type="button" class="btn" data-a="reset">Zurücksetzen</button>`),
 bar:el=>{UI.bar=+el.dataset.v;sheet('');render()},
 reset:()=>{location.reload()},
 hseg:el=>{UI.hseg=el.dataset.v;render()},
 start:el=>{UI.emom=null;UI.feel=null;UI.wday=UI.sel;startW(el.dataset.w)},
 set:el=>{const x=UI.w.ex[+el.dataset.x],s=x.sets[+el.dataset.s];s.done=!s.done;
   if(s.done){const r=x.rest;if(r)UI.rest={end:Date.now()+r*1000,total:r}}render()},
 addset:el=>{const x=UI.w.ex[+el.dataset.x],l=x.sets[x.sets.length-1];x.sets.push({kg:l?l.kg:0,r:l?l.r:0,done:false});render()},
 restp:()=>{if(UI.rest){UI.rest.end+=10000;UI.rest.total+=10}restbar()},
 restm:()=>{if(UI.rest){UI.rest.end-=10000}restbar()},
 rinc:el=>{const x=UI.w.ex[+el.dataset.x];x.rest=Math.min(600,x.rest+10);render()},
 rdec:el=>{const x=UI.w.ex[+el.dataset.x];x.rest=Math.max(0,x.rest-10);render()},
 restskip:()=>{UI.rest=null;restbar()},
 emom:()=>{const E=UI.emom||(UI.emom={r:0,left:60,run:false,done:false});E.run=!E.run;render()},
 info:el=>infoSheet(UI.w.ex[+el.dataset.x].id,UI.w.ex[+el.dataset.x].name),
 infoid:el=>infoSheet(el.dataset.x,EX[el.dataset.x].n),
 swap:el=>{const xi=+el.dataset.x,x=UI.w.ex[xi],e=EX[x.orig];
   sheet(`<h3>Alternative zu ${esc(e.n)}</h3><span class="hint">Gleiche Bewegung, gleiche Muskeln. Gilt nur für heute, außer du sagst „immer“.</span>
   ${e.alt.map(([n,d],i)=>`<button type="button" class="opt" data-a="swapto" data-x="${xi}" data-i="${i}"><span style="flex:1"><b>${esc(n)}</b><small>${esc(d)}</small></span>›</button>`).join('')}
   ${x.swapped?`<button type="button" class="btn" data-a="swapback" data-x="${xi}">Zurück zu ${esc(e.n)}</button>`:''}`)},
 swapto:el=>{const x=UI.w.ex[+el.dataset.x],e=EX[x.orig];x.name=e.alt[+el.dataset.i][0];x.swapped=true;x.sets.forEach(s=>{s.done=false});sheet('');render();toast('Für heute getauscht')},
 swapback:el=>{const x=UI.w.ex[+el.dataset.x];x.name=EX[x.orig].n;x.swapped=false;sheet('');render()},
 wcancel:()=>{UI.w=null;UI.rest=null;UI.emom=null;home()},
 wfinish:()=>{UI.rest=null;UI.page={t:'done'};render('push');window.scrollTo(0,0)},
 wclose:()=>{DONE.add(UI.wday??wd);UI.w=null;UI.emom=null;home();toast('Training gespeichert ✓')},
 feel:el=>{UI.feel=+el.dataset.v;render()},
 exd:el=>go({t:'ex',x:el.dataset.x}),
 exlist:()=>go({t:'exlist'}),
 plan:()=>go({t:'plan'}),
 plancopy:()=>{NEXT.days=WEEK.map(a=>a.slice());render();toast('Von dieser Woche übernommen')},
 planclear:()=>{NEXT.days=[[],[],[],[],[],[],[]];render()},
 plansave:()=>{back();toast('Nächste Woche geplant')},
 shift:el=>{const i=+el.dataset.i,o=['','F','S','N'];NEXT.shift[i]=o[(o.indexOf(NEXT.shift[i])+1)%4];render()},
 pdel:el=>{NEXT.days[+el.dataset.i].splice(+el.dataset.j,1);render()},
 padd:el=>{const i=+el.dataset.i;sheet(`<h3>${DN[i]} ${dateOf(i,1).getDate()}.</h3>${['push','pull','c','lauf','qual'].map(k=>`<button type="button" class="opt" data-a="paddk" data-i="${i}" data-k="${k}"><span class="tg ${W[k].k}" style="font-size:12px;padding:4px 8px">${W[k].n}</span><span style="flex:1"><small>${W[k].ex?W[k].ex.length+' Übungen · ca. '+W[k].min+' min':W[k].desc}</small></span></button>`).join('')}`)},
 paddk:el=>{NEXT.days[+el.dataset.i].push(el.dataset.k);sheet('');render()},
 run:el=>{const R={k:'easy',ivp:'3x8',iv:IVP['3x8'].v.map(a=>a.slice()),own:{n:5,len:1000,u:'m',p:'2 min traben'}};runVals(R,el.dataset.k==='iv'?'iv':'easy');go({t:'run',r:R})},
 rtype:el=>{runVals(UI.page.r,el.dataset.v);render()},
 ivp:el=>{const R=UI.page.r,k=el.dataset.v;R.ivp=k;R.iv=k==='own'?Array.from({length:R.own.n},()=>['','']):IVP[k].v.map(a=>a.slice());render()},
 ownu:el=>{const R=UI.page.r;R.own.u=el.dataset.v;R.own.len=R.own.u==='m'?1000:5;R.iv=R.iv.map(()=>['','']);render()},
 runsave:()=>{const R=UI.page.r,P=R.ivp==='own'?R.own:IVP[R.ivp];RUNS.unshift({d:0,t:R.k==='iv'?'iv':'easy',n:R.k==='iv'?'Intervalle '+ivName(P):'Lauf locker',km:R.km,dur:R.h*3600+R.m*60+R.s,hr:R.hr,max:R.max});
   const top=UI.stack[UI.stack.length-1];if(top&&top.t==='runs')UI.page=UI.stack.pop();else UI.page={t:'runs'};render('push');window.scrollTo(0,0);toast('Lauf gespeichert ✓')},
 runs:()=>go({t:'runs'})};
function runVals(R,k){R.k=k;[R.h,R.m,R.s,R.km,R.hr,R.max]=k==='iv'?[0,46,0,7.2,158,175]:[1,1,30,8.1,146,158]}
function infoSheet(id,name){const e=EX[id];sheet(`<h3>${esc(name)}</h3><span class="label">So geht's</span><ul>${e.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  <span class="label">Typischer Fehler</span><span style="font-size:14.5px">${esc(e.err)}</span>
  <a class="btn" style="text-decoration:none;color:var(--fg)" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' Ausführung')}" target="_blank" rel="noopener">▶ Video ansehen</a>`)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||(el.dataset.a==='close'&&e.target!==el))return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.in&&UI.w){const s=UI.w.ex[+el.dataset.x].sets[+el.dataset.s],v=parseFloat(String(el.value).replace(',','.'));if(!isNaN(v))s[el.dataset.in]=v;return}
  if(el.dataset.iv&&UI.page&&UI.page.t==='run'){const R=UI.page.r;R.iv[+el.dataset.iv][+el.dataset.f]=el.value;
    const P=R.ivp==='own'?R.own:IVP[R.ivp],sm=el.closest('.ivrow').querySelector('.lb small');if(sm&&el.dataset.f==='0'){const t=toSec(el.value);sm.textContent=t>0?'= '+mmss(t/(P.len/1000))+' /km':''}return}
  if(el.dataset.own&&UI.page&&UI.page.t==='run'){const O=UI.page.r.own;O[el.dataset.own]=el.dataset.own==='p'?el.value:(parseInt(el.value)||0);return}
  if(el.dataset.rf&&UI.page&&UI.page.t==='run'){const R=UI.page.r,v=el.value;
    if(el.dataset.rf==='dur'){const p=v.split(':').map(Number);if(p.length===3){R.h=p[0]||0;R.m=p[1]||0;R.s=p[2]||0}else if(p.length===2){R.h=0;R.m=p[0]||0;R.s=p[1]||0}}
    else R[el.dataset.rf]=parseFloat(String(v).replace(',','.'))||0;
    const sec=R.h*3600+R.m*60+R.s;$('#pace').textContent=R.km>0&&sec?mmss(sec/R.km):'–';
    const ok=$('#hrok');if(ok&&R.k==='easy'){ok.textContent=R.hr<150?'Puls unter 150 ✓':'Puls über 150';ok.style.color=R.hr<150?'var(--accent)':'var(--amber)'}}});
document.addEventListener('change',e=>{const el=e.target;if(!UI.page||UI.page.t!=='run')return;const R=UI.page.r;
  if(el.dataset.own==='n'){const n=Math.max(1,Math.min(20,R.own.n||1));R.own.n=n;R.iv=Array.from({length:n},(_,i)=>R.iv[i]||['',''])}
  if(el.dataset.own)render()});
render();
setTimeout(()=>{try{if(!sessionStorage.getItem('proto-seen')){ACT.proto();sessionStorage.setItem('proto-seen','1')}}catch(e){ACT.proto()}},400);
</script>

</body>
